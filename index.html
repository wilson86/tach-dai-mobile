<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<title>Tách Đài 3 Miền Mobile</title>
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee8;
    --primary:#0b57d0;--primary2:#0842a0;--danger:#b42318;--dangerbg:#fff1f0;
    --ok:#067647;--okbg:#ecfdf3;--shadow:0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .app{max-width:780px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  .title{font-weight:800;font-size:20px;margin:2px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label.small{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  select,input[type=date]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-size:16px;color:var(--text)}
  .today{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:14px}
  .today input{width:20px;height:20px}
  .schedule{margin-top:9px;padding:9px 10px;border-radius:10px;background:#f2f5fa;font-size:13px;line-height:1.45}
  .label{font-size:14px;font-weight:750;margin:0 0 6px}
  textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font:15px/1.42 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;resize:vertical;color:#111827;background:#fff}
  #input{min-height:250px}
  #output{min-height:220px}
  textarea:focus,select:focus,input:focus{outline:2px solid rgba(11,87,208,.18);border-color:var(--primary)}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
  button{height:44px;border:0;border-radius:10px;padding:0 14px;font-weight:750;font-size:14px;cursor:pointer}
  .primary{background:var(--primary);color:#fff;flex:1 1 180px}
  .primary:active{background:var(--primary2)}
  .secondary{background:#eef2f7;color:#27364b}
  .danger{background:#fff0ee;color:var(--danger)}
  .status{margin-top:8px;font-size:13px;font-weight:700}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--danger)}
  .result-card.error{border-color:#f6b9b4;background:var(--dangerbg)}
  .result-card.ok{border-color:#a6e3c2;background:var(--okbg)}
  .hint{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}
  .pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;background:#eef2f7;font-size:12px;font-weight:700;margin-right:4px}
  @media (max-width:520px){
    .app{padding:8px 8px calc(18px + env(safe-area-inset-bottom))}
    .card{border-radius:12px;padding:10px}
    .title{font-size:18px}
    .controls{grid-template-columns:1fr}
    #input{min-height:230px}
    #output{min-height:200px}
    button{height:46px;font-size:15px}
  }
</style>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Tách Đài">
<meta name="apple-mobile-web-app-title" content="Tách Đài">

</head>
<body>
<div class="app">

  <div id="updateBanner" style="display:none;background:#fff7d6;border:1px solid #f1d46a;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.4">
    <b id="updateText">Có bản cập nhật mới.</b>
    <button id="updateNowBtn" style="height:38px;margin-left:8px;background:#0b57d0;color:#fff;border:0;border-radius:9px;padding:0 12px;font-weight:700">Cập nhật ngay</button>
  </div>

  <div class="title">Tách Đài 3 Miền <span style="font-size:12px;color:#667085;font-weight:600">v2.0.18</span></div>

  <div class="card">
    <div class="controls">
      <div>
        <label class="small" for="region">Miền</label>
        <select id="region">
          <option value="mn">Miền Nam</option>
          <option value="mt">Miền Trung</option>
          <option value="mb">Miền Bắc</option>
        </select>
      </div>
      <div>
        <label class="small" for="date">Ngày</label>
        <input id="date" type="date">
      </div>
      <div id="mbSplitControl">
        <label class="small" for="mbSplitCount">MB · chia ngang</label>
        <select id="mbSplitCount" aria-label="Số nhánh chia ngang Miền Bắc">
          <option value="2">2 nhánh</option>
          <option value="3">3 nhánh</option>
          <option value="4">4 nhánh</option>
        </select>
      </div>
    </div>
    <label class="today"><input id="today" type="checkbox" checked> Hôm nay</label>
    <div id="schedule" class="schedule"></div>
  </div>

  <div class="card">
    <div class="label">Nhập tin / nguyên đoạn chat</div>
    <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="Dán tin hoặc đoạn chat vào đây..."></textarea>

    <div class="actions">
      <button id="runBtn" class="primary">Kiểm tra + Tách</button>
      <button id="undoBtn" class="secondary">Hoàn tác</button>
      <button id="clearBtn" class="danger">Xóa</button>
    </div>
    <div id="status" class="status"></div>
    <div class="hint">Chat: bỏ ngày/giờ + tên người gửi; riêng <b>Vinh</b> xóa toàn bộ tin/block. Tên khác chỉ bỏ tên, giữ nội dung.</div>
  </div>

  <div id="resultCard" class="card result-card">
    <div class="label">Kết quả</div>
    <textarea id="output" readonly spellcheck="false"></textarea>
    <div class="actions">
      <button id="cutBtn" class="secondary">Cắt phần chọn</button>
      <button id="copyBtn" class="secondary">Copy kết quả</button>
    </div>
  </div>
</div>

<script src="./station_calendar.generated.js"></script>
<script src="./business_engine.generated.js"></script>
<script>
"use strict";

// Calendar data is generated from the Router's sole authority.  UI code may
// render it but must never own an independently maintained weekday table.
if(!globalThis.KTS_STATION_CALENDAR) throw new Error("CALENDAR_AUTHORITY_MISSING");
const {MN,MT}=globalThis.KTS_STATION_CALENDAR;

const REGION_LABEL={mn:"Miền Nam",mt:"Miền Trung",mb:"Miền Bắc"};
const BET_TYPES=new Set(KTS_BUSINESS_ENGINE.selectorGroups.bet_tokens);
const DX_TYPES=new Set(KTS_BUSINESS_ENGINE.selectorGroups.dx_tokens);
const TWO_STATION_DA=new Set(KTS_BUSINESS_ENGINE.selectorGroups.two_station_da_tokens);
const IGNORED_SENDERS=new Set(["vinh"]);
const CHAT_HEADER_RE=/^\[([^\]]+)\]\s*([^:]+?)(?:\s+in\s+reply\s+to\s+[^:]+?)?:\s*(.*)$/i;
const CHAT_SENDER_TIME_RE=/^([^,\[\]:]{1,80}),\s*\[([^\]]+)\]\s*:?\s*(.*)$/i;
const CHAT_SENDER_PREFIX_RE=/^([^\d:]{1,80}):\s*(.*)$/u;
const CHAT_METADATA_ONLY_RE=/^(?:[-–—]\s*)?(?:\[\s*)?(?:\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?(?:[,\s]+(?:\d{1,2}:\d{2}(?:\s*[ap]m)?))?|\d{1,2}:\d{2}(?:\s*[ap]m)?)(?:\s*\])?$/iu;
const ALL_STATION_CODES=new Set([
  ...Object.values(MN).flat().map(x=>x[0]),
  ...Object.values(MT).flat().map(x=>x[0])
]);

const $=id=>document.getElementById(id);
const regionEl=$("region"), dateEl=$("date"), todayEl=$("today"), scheduleEl=$("schedule"), mbSplitControl=$("mbSplitControl"), mbSplitEl=$("mbSplitCount");
const inputEl=$("input"), outputEl=$("output"), runBtn=$("runBtn"), statusEl=$("status");
const resultCard=$("resultCard");

let undoStack=[];
let outputRecords=[]; // [{sourceLine,text,alive}]
let lastOutputSelection={start:0,end:0};

// v2.0.5: source lines dùng để đồng bộ Input <-> Kết quả.
// Giữ mapping riêng để xóa 1 tin trong Input thì chỉ xóa KQ của tin đó,
// không rerun mù làm sống lại các output đã Cut trước đó.
let lastSourceLines=[];
let inputSyncTimer=null;

function localDateISO(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseLocalDate(v){
  return new Date(`${v}T12:00:00`);
}
function formatDateVN(d){
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function weekdayVN(day){
  return ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][day];
}
function getSchedule(region, date){
  if(region==="mb") return [["mb","Miền Bắc"]];
  return (region==="mn"?MN:MT)[date.getDay()] || [];
}
function oneWord(name){ return name.trim().split(/\s+/).length===1; }
function stationInfo([alias,name],i){
  const role=i<2?"chính":"phụ";
  return oneWord(name)?`${name} (${role})`:`${alias.toUpperCase()} (${name}, ${role})`;
}
function updateUI(){
  if(todayEl.checked){
    dateEl.value=localDateISO();
    dateEl.disabled=true;
  }else{
    dateEl.disabled=false;
    if(!dateEl.value) dateEl.value=localDateISO();
  }
  const region=regionEl.value;
  if(mbSplitControl) mbSplitControl.style.display=region==="mb"?"block":"none";
  const d=parseLocalDate(dateEl.value||localDateISO());
  const stations=getSchedule(region,d);
  runBtn.textContent="Kiểm tra + Tách";
  scheduleEl.innerHTML=
    `<span class="pill">${REGION_LABEL[region]}</span>`+
    `<span class="pill">${weekdayVN(d.getDay())} ${formatDateVN(d)}</span><br>`+
    stations.map(stationInfo).join(" - ");
  saveSettings();
}

function saveSettings(){
  try{
    localStorage.setItem("tachDaiMobileSettings",JSON.stringify({
      region:regionEl.value,date:dateEl.value,today:todayEl.checked
    }));
  }catch(_){}
}
function loadSettings(){
  dateEl.value=localDateISO();
  try{
    const s=JSON.parse(localStorage.getItem("tachDaiMobileSettings")||"{}");
    if(["mn","mt","mb"].includes(s.region)) regionEl.value=s.region;
    if(typeof s.today==="boolean") todayEl.checked=s.today;
    if(s.date) dateEl.value=s.date;
  }catch(_){}
  updateUI();
}

function stripInvisible(s){
  return (s||"").replace(/[\u2068\u2069\u200e\u200f\ufeff]/g,"");
}
const FULL_STATION_INPUT_ALIASES=KTS_BUSINESS_ENGINE.stationAliases;

function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}
function normalizeFullStationNames(s){
  for(const [phrase,code] of FULL_STATION_INPUT_ALIASES){
    const pat=phrase.split(/\s+/).map(escapeRegExp).join("\\s+");
    const re=new RegExp(`(^|\\s)${pat}(?=\\s|$)`,"gu");
    s=s.replace(re,`$1${code}`);
  }
  return s;
}

function normalizeContextualBlStationSlots(s){
  // `bl` is overloaded: it means Bạc Liêu only while the grammar is still
  // reading a station header. Once a lottery number has appeared it remains
  // the established BAO LÔ selector. This is syntactic context, never time.
  return String(s||"").split("\n").map(line=>{
    const parts=line.split(/(\s+|[.:|+])/u), prior=[];
    for(let i=0;i<parts.length;i++){
      const token=parts[i]; if(!token || /^(?:\s+|[.:|+])$/u.test(token)) continue;
      const lower=token.toLowerCase();
      let next=""; for(let j=i+1;j<parts.length;j++) if(parts[j]&&!/^(?:\s+|[.:|+])$/u.test(parts[j])){next=parts[j];break;}
      const stationHeader=prior.every(x=>ALL_STATION_CODES.has(x)||["mn","mt","mb","2d","3d","4d"].includes(x));
      if(lower==="bl" && stationHeader && /^\d{1,4}$/u.test(next)) parts[i]="bli";
      prior.push(String(parts[i]).toLowerCase());
    }
    return parts.join("");
  }).join("\n");
}

function normalizeDuplicateAmountSuffix(s){
  // Only a complete selector-scoped amount token is repaired. Arbitrary
  // words containing `nn`, and non-0.5 decimals, remain fail-closed later.
  const selector="(?:dathang|dat|bao|bl|lo|lô|duoi|đuôi|dau|đầu|dx|đx|da|đá|dd|đđ|xc|b|d|x)";
  return String(s||"").replace(new RegExp(`\\b(${selector}\\s*)(\\d+(?:[.,]\\d+)?)nn\\b`,"giu"),"$1$2n");
}

function normalizeNumericBetSeparators(s){
  // A dot is a separator only inside a numeric betting run, never a blanket
  // punctuation replacement. In particular, retain decimal money after a bet
  // such as `b 10.50` / `xc 10.50n` and non-betting text such as dates.
  const tokens=s.split(/(\s+)/u);
  const hasBetSyntax=tokens.some(token=>token && !/^\s+$/u.test(token) && (isBetType(token)||splitCompactBetToken(token)));
  if(!hasBetSyntax) return s;
  const protectedMoney=[];
  for(let i=0;i<tokens.length;i++){
    if(!tokens[i] || /^\s+$/u.test(tokens[i]) || !isBetType(tokens[i])) continue;
    let j=i+1; while(j<tokens.length && /^\s+$/u.test(tokens[j])) j++;
    if(j<tokens.length && isMoneyToken(tokens[j])){
      protectedMoney.push(tokens[j]);
      tokens[j]=`\uE000${protectedMoney.length-1}\uE001`;
    }
  }
  s=tokens.join("");
  let previous;
  do{
    previous=s;
    // Repeat to consume chained forms: 868...879..299 -> 868 879 299.
    s=s.replace(/(^|[^\d])(\d{2,4})\s*\.+\s*(\d{2,4})(?![\dA-Za-zĐđ])/gu,"$1$2 $3");
  }while(s!==previous);
  return s.replace(/\uE000(\d+)\uE001/gu,(_,index)=>protectedMoney[Number(index)]);
}

function normalizeBetGrammarSeparators(s){
  // Real Telegram input often joins betting atoms with dots/underscores or a
  // pipe.  This is deliberately lexical and conditional: it runs only when
  // the line already contains betting grammar, protects decimal money, and
  // never performs a blanket punctuation replacement on chat/metadata.
  const hasBetSyntax=/(?:^|[\s._,|])(?:[234]d|b|bao|dd|đđ|xc|x|dx|đx|da|đá|dat|dathang|d|duoi|đuôi|dau|đầu|lo|lô|bl)(?=\s|\d|[._,|]|$)/iu.test(s);
  if(!hasBetSyntax) return s;
  const protectedDecimals=[];
  const hold=value=>`\uE100${protectedDecimals.push(value)-1}\uE101`;
  const selector="(?:dathang|bao|dat|dd|đđ|xc|dx|đx|da|đá|duoi|đuôi|dau|đầu|lo|lô|bl|b|x|d)";
  // Underscore-delimited Telegram input may split a money unit and the next
  // selector (`b_20_n_da_5_n`).  This is grammar-aware, not a global `_` rewrite.
  s=s.replace(new RegExp(`(${selector})\\s*_+\\s*(\\d+(?:[.,]\\d+)?)\\s*_+\\s*([nd])\\b`,"giu"),"$1 $2 $3");
  s=s.replace(new RegExp(`(\\d+(?:[.,]\\d+)?)\\s*_+\\s*([nd])(?=\\s*_+\\s*${selector}(?:\\s|\\d|[._,|]|$))`,"giu"),"$1 $2");
  s=s.replace(new RegExp(`([nd])\\s*_+\\s*(?=${selector}(?:\\s|\\d|[._,|]|$))`,"giu"),"$1 ");
  // Telegram sometimes separates the unit from a decimal amount.  This is
  // still one money atom, not the numbers 2 and 5 plus a stray `n`.
  s=s.replace(new RegExp(`\\b(${selector}\\s+\\d+[.,]\\d+)\\s+(n)\\b`,"giu"),"$1$2");
  // Split an attached selector+amount before the next selector.  Generic
  // atom splitting cannot reliably see through a later protected decimal.
  s=s.replace(new RegExp(`\\b(${selector}\\d+(?:[.,]\\d+)?[a-zđ]?)\\s*[._,]+\\s*(?=${selector}(?:\\s|\\d|[._,|]|$))`,"giu"),"$1 ");
  // A decimal is money only when it is immediately bound to a wager selector.
  s=s.replace(new RegExp(`\\b${selector}\\d+[.,]\\d+[a-zđ]?\\b`,"giu"),hold);
  s=s.replace(new RegExp(`\\b${selector}\\s+\\d+[.,]\\d+[a-zđ]?\\b`,"giu"),hold);
  // A pipe is an explicit ticket/line boundary, never a wager atom.
  s=s.replace(/\s*\|+\s*/gu,"\uE102");
  // `72dau100n` is the same compact grammar as `72 dau100n`.
  s=s.replace(/(\d{1,4})(?=(?:dau|đầu|duoi|đuôi)\d)/giu,"$1 ");
  s=s.replace(/([234]d)\s*[._,]+\s*(\d{1,4})(?![\dA-Za-zĐđ])/giu,"$1 $2");
  const atom=token=>{
    const t=token.toLowerCase();
    return ALL_STATION_CODES.has(t)||isNumberToken(t)||["2d","3d","4d"].includes(t)||
    isBetType(t)||isMoneyToken(t)||!!splitCompactBetToken(t)||/^\uE100\d+\uE101$/u.test(t);
  };
  let previous;
  do{
    previous=s;
    s=s.replace(/([^\s._,|]+)\s*[._,]+\s*([^\s._,|]+)/gu,(whole,left,right)=>
      atom(left)&&atom(right)?`${left} ${right}`:whole);
  }while(s!==previous);
  // A final dot immediately following a betting atom is prose punctuation,
  // not source content; retain all other punctuation untouched.
  s=s.replace(/([^\s._,|])[.,]+(?=\s|\uE102|$)/gu,"$1 ");
  return s.replace(/\uE100(\d+)\uE101/gu,(_,index)=>protectedDecimals[Number(index)]).replace(/\uE102/gu,"\n");
}

function normalizeInput(s){
  s=stripInvisible(s).toLowerCase().trim();
  s=KTS_BUSINESS_ENGINE.normalizeCompactTicket(s);
  // `2 đài phụ` is a relative schedule selector, never a station alias.
  // Normalize it before punctuation and number-group parsing so `2dphu.92`
  // cannot become an invalid station token.
  s=s.replace(/(^|\s)(?:2dph[uụ]|2d\s+ph[uụ]|2\s+đài\s+ph[uụ]|2\s+dai\s+ph[uụ])(?=$|\s|[.:|])/gu,"$12dphu");
  s=s.replace(/(^|\s)2dphu\s*[.:|]+\s*(?=\d)/gu,"$12dphu ");
  // '+' giữa các đài chỉ là dấu phân cách.
  s=s.replace(/\s*\+\s*/gu," ");
  // Tên đài viết nguyên, có dấu hoặc không dấu -> mã chuẩn.
  s=normalizeFullStationNames(s);
  s=normalizeContextualBlStationSlots(s);
  // A colon after the resolved Bạc Liêu station is clause punctuation, not
  // part of its station token (`BL:79` -> `bli 79`).
  s=s.replace(/(^|\n)bli\s*:\s*(?=\d)/gu,"$1bli ");
  // Operators commonly type "Duôi" with Latin D.  It is the existing
  // DUOI selector spelling, never a station or a new wager semantic.
  s=s.replace(/(^|\s)duôi(?=\s|\d|$)/giu,"$1duoi");
  s=s.replace(/(^|\s)dna(?=\s|$)/gu,"$1dn");
  // Telegram shorthand aliases for the explicit central stations.  They are
  // canonical station identities, never selector/number tokens.
  s=s.replace(/(^|\s)dnang(?=\s|$)/gu,"$1dn");
  s=s.replace(/(^|\s)qngai(?=\s|$)/gu,"$1qn");
  s=s.replace(/(^|\s)hu(?=\s|$)/gu,"$1hue");
  // `bl` is the operator's BAO LÔ selector. Bạc Liêu keeps the explicit
  // station code `bli` (or its full name), so a wager is never reclassified
  // as a station by normalization.
  s=s.replace(/(^|\s)dathang(?=\s|$)/gu,"$1dat");
  s=normalizeNumericBetSeparators(s);
  // Repeated dots between whole lottery-number atoms are clause delimiters;
  // a single decimal separator remains protected by the numeric normalizer.
  s=s.replace(/(\d{1,4})\.{2,}(?=\d{1,4}(?:\.{2,}|\s|$))/gu,"$1 ");
  s=normalizeBetGrammarSeparators(s);
  s=normalizeDuplicateAmountSuffix(s);
  // A separated amount unit is valid only in selector context: `b 20 n`,
  // `b20 n`, `dx 2,5 n`.  Do not globally join a number followed by a letter.
  s=s.replace(/\b((?:dathang|dat|bao|bl|lo|lô|duoi|đuôi|dau|đầu|dx|đx|da|đá|dd|đđ|xc|b|d|x)\s*\d+(?:[.,]\d+)?)\s+([nd])\b/giu,"$1$2");
  s=s.replace(/(^|\s)\.+(?=\d)/gu,"$1");
  return s.replace(/[^\S\r\n]+/g," ").replace(/ *\n */g,"\n").trim();
}
function normalizeSenderName(s){
  return stripInvisible(s).trim().toLowerCase().replace(/\s+/g," ");
}
function isSenderPrefix(prefix){
  prefix=normalizeSenderName(prefix);
  if(!prefix || /\d/u.test(prefix)) return false;
  const normalized=normalizeInput(prefix);
  if(ALL_STATION_CODES.has(normalized)) return false;
  if(["2d","3d","4d","mn","mt","mb"].includes(normalized)) return false;
  return true;
}
function parseChatEnvelope(line){
  let m=line.match(CHAT_HEADER_RE);
  if(m) return {sender:m[2]||"",body:m[3]||"",metadata:false};
  m=line.match(CHAT_SENDER_TIME_RE);
  if(m && isSenderPrefix(m[1])) return {sender:m[1]||"",body:m[3]||"",metadata:false};
  m=line.match(CHAT_SENDER_PREFIX_RE);
  // `BL:79 ...` is Bạc Liêu station punctuation, not a chat sender label.
  if(m && /^bl$/iu.test(m[1]) && /^\s*\d{1,4}\b/u.test(m[2]||"")) return null;
  if(m && isSenderPrefix(m[1])) return {sender:m[1]||"",body:m[2]||"",metadata:false};
  if(CHAT_METADATA_ONLY_RE.test(line)) return {sender:null,body:"",metadata:true};

  const chunks=splitBetChunks(m[2].trim());
  if(!chunks.length)return [s];
  const out=[];
  for(const c of chunks) out.push(...expandChunk(m[1],c,region,stations));
  return out;
}

function validateBatch(text,region,stations){
  const errors=[];
  text.split(/\r?\n/).forEach((raw,idx)=>{
    raw=raw.trim(); if(!raw)return;
    try{validateCheckOnlyLine(raw,region,stations);}
    catch(e){errors.push({line:idx+1,msg:e.message,raw});}
  });
  return errors;
}
function snapshot(){
  undoStack.push({
    input:inputEl.value,
    output:outputEl.value,
    status:statusEl.textContent,
    cls:statusEl.className,
    outputRecords:outputRecords.map(r=>({...r})),
    sourceLines:lastSourceLines.slice()
  });
  if(undoStack.length>30)undoStack.shift();
}
function selectLine(textarea,lineNo){
  const lines=textarea.value.split("\n");
  let start=0;
  for(let i=0;i<lineNo-1;i++)start+=lines[i].length+1;
  const end=start+(lines[lineNo-1]||"").length;
  textarea.focus();
  textarea.setSelectionRange(start,end);
}
function setStatus(text,type=""){
  statusEl.textContent=text;
  statusEl.className=`status ${type}`;
  resultCard.className=`card result-card ${type==="err"?"error":type==="ok"?"ok":""}`;
}


function resetOutputRecords(){
  outputRecords=[];
  lastSourceLines=[];
  lastOutputSelection={start:0,end:0};
}

function renderOutputRecords(){
  outputEl.value=outputRecords.filter(r=>r.alive).map(r=>r.text).join("\n");
}

function currentPlainInputLines(){
  // Chỉ dùng fast-path khi không phải Telegram/chat log.
  // Chat log cần đi qua preprocess đầy đủ bằng run().
  const raw=inputEl.value;
  if(looksLikeChatLog(raw)) return null;
  return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
}

function mapPureDeletion(oldLines,newLines){
  // Trả Map old sourceLine -> new sourceLine nếu newLines chỉ là
  // oldLines bị xóa bớt, giữ nguyên thứ tự/nội dung.
  // Nếu có sửa nội dung/thêm/reorder thì trả null để fallback run().
  const oldToNew=new Map();
  let j=0;

  for(let i=0;i<oldLines.length;i++){
    if(j<newLines.length && oldLines[i]===newLines[j]){
      oldToNew.set(i+1,j+1);
      j++;
    }
  }
  if(j!==newLines.length) return null;

  // Nếu số dòng không giảm thì không phải pure deletion.
  if(newLines.length>=oldLines.length) return null;
  return oldToNew;
}

function syncPureInputDeletionNow(){
  const newLines=currentPlainInputLines();
  if(newLines===null) return false;

  if(!newLines.length){
    outputRecords=[];
    lastSourceLines=[];
    renderOutputRecords();
    lastOutputSelection={start:0,end:0};
    setStatus("Đã xóa hết tin • Kết quả đã đồng bộ","ok");
    return true;
  }

  if(!lastSourceLines.length || !outputRecords.length) return false;

  const oldToNew=mapPureDeletion(lastSourceLines,newLines);
  if(!oldToNew) return false;

  const oldCount=lastSourceLines.length;

  // Giữ nguyên alive/dead của output các source còn lại.
  // Nhờ vậy các dòng đã Cut trước đó KHÔNG bị sinh lại.
  outputRecords=outputRecords
    .filter(r=>oldToNew.has(r.sourceLine))
    .map(r=>({...r,sourceLine:oldToNew.get(r.sourceLine)}));

  lastSourceLines=newLines.slice();
  renderOutputRecords();
  lastOutputSelection={start:0,end:0};

  const removed=oldCount-newLines.length;
  setStatus(`Đã đồng bộ ngay • xóa ${removed} tin gốc`,"ok");
  return true;
}

function scheduleFullInputSync(){
  if(inputSyncTimer && typeof clearTimeout==="function") clearTimeout(inputSyncTimer);
  inputSyncTimer=setTimeout(()=>{
    inputSyncTimer=null;
    if(inputEl.value.trim()){
      run();
    }else{
      outputEl.value="";
      resetOutputRecords();
      setStatus("");
    }
  },100);
}

function syncAfterAnyInputEdit(){
  // Fast path: xóa nguyên dòng/tin -> KQ đổi ngay, không cần debounce.
  if(syncPureInputDeletionNow()) return;

  // Các thay đổi khác (sửa số, thêm tin, paste...) chạy parser sau 100ms.
  scheduleFullInputSync();
}

function rememberOutputSelection(){
  const s=outputEl.selectionStart ?? 0;
  const e=outputEl.selectionEnd ?? s;
  if(e>s) lastOutputSelection={start:s,end:e};
}

function selectedAliveRecordIndexes(){
  const alive=[];
  outputRecords.forEach((r,idx)=>{ if(r.alive) alive.push(idx); });
  if(!alive.length) return [];

  const rendered=alive.map(i=>outputRecords[i].text).join("\n");
  let start=lastOutputSelection.start, end=lastOutputSelection.end;
  const cs=outputEl.selectionStart ?? 0;
  const ce=outputEl.selectionEnd ?? cs;
  if(ce>cs){ start=cs; end=ce; }

  if(end<=start || start<0 || start>rendered.length) return [];

  let firstLine=0, lastLine=0;
  for(let i=0;i<start;i++) if(rendered[i]==="\n") firstLine++;
  lastLine=firstLine;
  for(let i=start;i<Math.min(end,rendered.length);i++) if(rendered[i]==="\n") lastLine++;

  if(end>start && rendered[end-1]==="\n" && lastLine>firstLine) lastLine--;

  const picked=[];
  for(let visibleLine=firstLine;visibleLine<=lastLine;visibleLine++){
    if(visibleLine>=0 && visibleLine<alive.length) picked.push(alive[visibleLine]);
  }
  return picked;
}

function deleteCompletedSourceLines(){
  if(!outputRecords.length) return;

  const grouped=new Map();
  outputRecords.forEach(r=>{
    if(!grouped.has(r.sourceLine)) grouped.set(r.sourceLine,[]);
    grouped.get(r.sourceLine).push(r);
  });

  const completed=new Set();
  for(const [sourceLine,records] of grouped.entries()){
    if(records.length && records.every(r=>!r.alive)) completed.add(sourceLine);
  }
  if(!completed.size) return;

  const oldLines=inputEl.value.split("\n");
  const kept=[];
  const oldToNew=new Map();
  let newNo=0;

  oldLines.forEach((line,idx)=>{
    const oldNo=idx+1;
    if(completed.has(oldNo)) return;
    kept.push(line);
    newNo++;
    oldToNew.set(oldNo,newNo);
  });

  inputEl.value=kept.join("\n");
  lastSourceLines=kept.slice();

  outputRecords=outputRecords
    .filter(r=>!completed.has(r.sourceLine))
    .map(r=>({...r,sourceLine:oldToNew.get(r.sourceLine) || r.sourceLine}));
}

async function writeClipboardText(text){
  if(!text) return false;
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(_){
    const tmp=document.createElement("textarea");
    tmp.value=text;
    tmp.style.position="fixed";
    tmp.style.left="-9999px";
    document.body.appendChild(tmp);
    tmp.select();
    let ok=false;
    try{ ok=document.execCommand("copy"); }catch(_e){}
    tmp.remove();
    return ok;
  }
}

async function cutSelectedOutput(){
  const indexes=selectedAliveRecordIndexes();
  if(!indexes.length){
    setStatus("Hãy bôi đen dòng kết quả cần cắt trước.","err");
    return;
  }

  snapshot();
  const selectedText=indexes.map(i=>outputRecords[i].text).join("\n");
  await writeClipboardText(selectedText);

  const inputBefore=inputEl.value;
  indexes.forEach(i=>{ outputRecords[i].alive=false; });
  deleteCompletedSourceLines();
  renderOutputRecords();

  lastOutputSelection={start:0,end:0};
  if(inputEl.value!==inputBefore){
    setStatus(`Đã cắt ${indexes.length} dòng • đã xóa tin gốc tương ứng`,"ok");
  }else{
    setStatus(`Đã cắt ${indexes.length} dòng • tin gốc vẫn giữ vì chưa cắt đủ`,"ok");
  }
}

function resolveExplicitSourceRegion(text){
  return KTS_BUSINESS_ENGINE.extractExplicitSourceRegion(text);
}

function run(){
  const raw=inputEl.value.trim();
  if(!raw){outputEl.value="";resetOutputRecords();setStatus("Chưa có tin.","err");return;}

  const wasChat=looksLikeChatLog(raw);
  const clean=wasChat?preprocessChatText(raw):raw;
  if(wasChat&&clean!==raw){
    snapshot();
    inputEl.value=clean;
  }
  if(!clean){outputEl.value="";resetOutputRecords();setStatus("Không còn tin sau khi lọc chat.","err");return;}

  const explicit=resolveExplicitSourceRegion(clean);
  const region=explicit.region||regionEl.value;
  const source=explicit.text;
  const d=parseLocalDate(dateEl.value||localDateISO());
  const stations=getSchedule(region,d);
  const errors=validateBatch(source,region,stations);

  if(errors.length){
    resetOutputRecords();
    outputEl.value="PHÁT HIỆN TIN SAI:\n\n"+errors.map(e=>`Dòng ${e.line}: ${e.msg}\n→ ${e.raw}`).join("\n\n");
    setStatus(`Có ${errors.length} lỗi`,"err");
    selectLine(inputEl,errors[0].line);
    return;
  }

  const lines=source.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  lastSourceLines=lines.slice();
  outputRecords=[];
  lines.forEach((line,idx)=>{
    const generated=processLine(line,region,stations);
    generated.forEach(text=>outputRecords.push({
      sourceLine:idx+1,
      text,
      alive:true
    }));
  });
  renderOutputRecords();
  setStatus(`Đã tách • ${outputRecords.length} dòng${wasChat?" • đã lọc chat":""}`,"ok");
}

async function copyOutput(){
  const text=outputEl.value;
  if(!text)return;
  try{
    await navigator.clipboard.writeText(text);
    setStatus("Đã copy kết quả","ok");
  }catch(_){
    outputEl.removeAttribute("readonly");
    outputEl.select();
    document.execCommand("copy");
    outputEl.setAttribute("readonly","");
    setStatus("Đã copy kết quả","ok");
  }
}

outputEl.addEventListener("select",rememberOutputSelection);
outputEl.addEventListener("mouseup",rememberOutputSelection);
outputEl.addEventListener("touchend",()=>setTimeout(rememberOutputSelection,0));
outputEl.addEventListener("keyup",rememberOutputSelection);

// Mobile selection handles có thể thay đổi selection mà không phát "select" ổn định.
// Ghi nhớ ở selectionchange + trước khi nút Cut lấy focus.
// Browser thật có document.addEventListener; regression Node/vm cũ có thể không stub API này.
if(typeof document!=="undefined" && typeof document.addEventListener==="function"){
  document.addEventListener("selectionchange",()=>{
    if(document.activeElement===outputEl) rememberOutputSelection();
  });
}
$("cutBtn").addEventListener("pointerdown",rememberOutputSelection);
$("cutBtn").addEventListener("touchstart",rememberOutputSelection,{passive:true});
$("cutBtn").addEventListener("click",cutSelectedOutput);
runBtn.addEventListener("click",run);
$("copyBtn").addEventListener("click",copyOutput);
$("clearBtn").addEventListener("click",()=>{
  if(inputEl.value||outputEl.value)snapshot();
  inputEl.value="";outputEl.value="";resetOutputRecords();setStatus("");
  inputEl.focus();
});
$("undoBtn").addEventListener("click",()=>{
  const s=undoStack.pop(); if(!s)return;
  inputEl.value=s.input;
  outputEl.value=s.output;
  outputRecords=(s.outputRecords||[]).map(r=>({...r}));
  lastSourceLines=(s.sourceLines||inputEl.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)).slice();
  lastOutputSelection={start:0,end:0};
  statusEl.textContent=s.status;
  statusEl.className=s.cls;
  resultCard.className=`card result-card ${s.cls.includes("err")?"error":s.cls.includes("ok")?"ok":""}`;
});
regionEl.addEventListener("change",updateUI);
dateEl.addEventListener("change",()=>{todayEl.checked=false;updateUI();});
todayEl.addEventListener("change",updateUI);

// v2.0.5: mọi kiểu sửa/xóa Input đều đồng bộ Kết quả.
// "input" bắt Backspace, Delete, Cut, paste, bàn phím mobile và native undo/redo.
inputEl.addEventListener("beforeinput",(ev)=>{
  // Với thao tác xóa, lưu snapshot trước khi browser thay đổi text để nút Hoàn tác
  // có thể phục hồi cả Input + Kết quả.
  if(ev && typeof ev.inputType==="string" && ev.inputType.startsWith("delete")){
    snapshot();
  }
});
inputEl.addEventListener("input",syncAfterAnyInputEdit);

loadSettings();

// =========================
// PWA / AUTO UPDATE
// =========================
const APP_VERSION = "2.0.18";
let swRegistration = null;

async function checkForAppUpdate() {
  // file:// không hỗ trợ Service Worker/PWA update.
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;

  try {
    const res = await fetch("./version.json?t=" + Date.now(), {
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    });
    if (!res.ok) return;
    const data = await res.json();

    if (data.version && data.version !== APP_VERSION) {
      $("updateText").textContent = `Có bản mới v${data.version}.`;
      $("updateBanner").style.display = "block";
    }
  } catch (_) {
    // Offline: im lặng, dùng bản đã cache.
  }

  try {
    if (swRegistration) await swRegistration.update();
  } catch (_) {}
}

async function doAppUpdate() {
  if (!swRegistration) {
    location.reload();
    return;
  }

  try {
    await swRegistration.update();
  } catch (_) {}

  if (swRegistration.waiting) {
    swRegistration.waiting.postMessage({ type: "SKIP_WAITING" });
    return;
  }

  // Nếu SW mới chưa vào waiting, reload để lấy index mới qua network-first.
  location.reload();
}

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", async () => {
    try {
      swRegistration = await navigator.serviceWorker.register("./sw.js", { scope: "./" });

      swRegistration.addEventListener("updatefound", () => {
        const worker = swRegistration.installing;
        if (!worker) return;
        worker.addEventListener("statechange", () => {
          if (worker.state === "installed" && navigator.serviceWorker.controller) {
            $("updateText").textContent = "Đã tải bản mới. Bấm Cập nhật ngay.";
            $("updateBanner").style.display = "block";
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        location.reload();
      });

      await checkForAppUpdate();
    } catch (_) {
      // Không ảnh hưởng chức năng tách/check.
    }
  });
}

$("updateNowBtn").addEventListener("click", doAppUpdate);

</script>

<!doctype html><html><head><meta charset="utf-8"><title>Isolated synthetic IndexedDB proof</title></head>
<body><pre id="proof">PENDING</pre>
<script src="/app/settlement-team-recovery-v0.js"></script>
<script src="/app/settlement-team-recovery-idb-v0.js"></script>
<script>
(async()=>{
const stage=new URL(location.href).searchParams.get('stage');
const actor={workspace_id:'group_a',user_id:'fake_user_a'},secret='only-synthetic-ci-recovery-passphrase-2026';
const item={id:'draft_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',status:'PENDING',base_revision:0,
scope:{workspace_id:'group_a',partner_id:'fake_partner_1',business_date:'2026-10-15',region:'mn'},
payload:{synthetic:true,memo:'disposable-native-idb-test'}};
const recovery=globalThis.KtsTeamSyntheticRecoveryV0,IDB=globalThis.KtsTeamSyntheticIndexedDbV0;
const yes=(cond,code)=>{if(!cond)throw Error(code)};
const denied=async fn=>{try{await fn();return false}catch(_){return true}};
try{
yes(isSecureContext===true&&recovery&&IDB,'NO_SECURE_BROWSER_DEPENDENCIES');
const store=IDB.createSyntheticIndexedDbStore({indexedDB,syntheticOnly:true});
if(stage==='save'){
 yes(await store.read(IDB.SLOT)===null,'BACKUP_ALREADY_EXISTS');
 const sealed=await recovery.seal({drafts:[item],actor,passphrase:secret,cryptoProvider:crypto});
 const bytes=recovery.serializeEnvelope(sealed);
 yes(!bytes.includes(secret)&&!bytes.includes(item.scope.partner_id)&&
 !bytes.includes(item.payload.memo),'PLAINTEXT_EXPOSED');
 yes(await store.writeIfAbsent(IDB.SLOT,bytes)===true,'FIRST_WRITE_NOT_COMMITTED');
 yes(await store.read(IDB.SLOT)===bytes,'READBACK_MISMATCH');
 yes(await store.writeIfAbsent(IDB.SLOT,bytes)===false,'DUPLICATE_OVERWRITE');
}else if(stage==='restore'){
 const bytes=await store.read(IDB.SLOT);
 yes(typeof bytes==='string'&&bytes.length>100,'BACKUP_MISSING_AFTER_RESTART');
 const sealed=recovery.parseEnvelope(bytes);
 const out=await recovery.open({envelope:sealed,actor,passphrase:secret,cryptoProvider:crypto});
 yes(out.status==='QUARANTINED'&&out.auto_send_enabled===false&&out.items.length===1&&
 out.items[0].id===item.id&&out.items[0].base_revision===0&&
 out.items[0].auto_retry===false,'RESTORED_INTENT_UNVERIFIED');
 yes(await denied(()=>recovery.open({envelope:sealed,actor,
 passphrase:'different-synthetic-passphrase-2026',cryptoProvider:crypto})),'WRONG_SECRET_ACCEPTED');
 yes(await denied(()=>recovery.open({envelope:sealed,
 actor:{...actor,user_id:'fake_another'},passphrase:secret,cryptoProvider:crypto})),'WRONG_USER_ACCEPTED');
 yes(await store.writeIfAbsent(IDB.SLOT,bytes)===false,'RESTART_OVERWRITE');
}else throw Error('UNKNOWN_STAGE');
document.getElementById('proof').textContent=JSON.stringify({stage,status:'PASS',
native_indexeddb:true,auto_send_enabled:false,original_id:item.id});
}catch(e){document.getElementById('proof').textContent=JSON.stringify({
stage,status:'FAIL',code:String(e.message||e).slice(0,100)})}
})().catch(()=>{document.getElementById('proof').textContent=
JSON.stringify({status:'FAIL',code:'UNCAUGHT_ASYNC'})});
</script></body></html>

name: Quyt MB fail-closed money and market review (public free Node)
on:
  pull_request:
    paths:
      - 'quyt-pwa/index.html'
      - 'tests/quyt-pwa-mb-money-hold.test.cjs'
      - '.github/workflows/quyt-mb-money-review.yml'
permissions:
  contents: read
jobs:
  mb-boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SHA-bound offline Node tests; no live data
        run: |
          node --version
          node --test tests/quyt-pwa-mb-money-hold.test.cjs

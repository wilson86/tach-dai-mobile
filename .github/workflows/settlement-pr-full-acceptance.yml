name: Settlement full PR browser acceptance
on:
  pull_request:
    paths:
      - "settlement-test/acceptance-smoke.html"
      - "settlement-test/settlement-qualification-history.js"
      - "settlement-test/settlement-store.js"
      - "settlement-test/settlement.html"
      - ".github/scripts/settlement-cdp-browser.cjs"
      - ".github/workflows/settlement-pr-full-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout PR candidate without publishing Pages
        uses: actions/checkout@v4
      - name: Full browser acceptance using test-only backend and disposable profile
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --experimental-websocket .github/scripts/settlement-cdp-browser.cjs acceptance

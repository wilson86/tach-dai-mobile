name: Quyt existing GitHub Pages UI-only grouped-result visibility (public free)
on:
  pull_request:
    paths:
      - 'quyt-pwa/index.html'
      - 'quyt-pwa/quyt-source-cut-ledger.js'
      - 'quyt-pwa/quyt-live-cut-ui.js'
      - 'quyt-pwa/sw.js'
      - 'quyt-pwa/station_calendar.generated.js'
      - 'quyt-pwa/manifest.webmanifest'
      - 'quyt-pwa/thu-nghiem/**'
      - 'tests/quyt-preview-pages-safety.test.cjs'
      - 'tests/quyt-pwa-grouped-frames.test.js'
      - 'tests/quyt-one-screen-money-review.test.cjs'
      - 'tests/quyt-one-screen-owner-rounding.test.cjs'
      - 'tests/quyt-pwa-main-visibility-headless.cjs'
      - 'tests/quyt-main-source-cut-contract.cjs'
      - 'tests/quyt-main-source-cut-f5.cjs'
      - 'tests/quyt-pwa-sw-route-boundary.test.cjs'
      - '.github/workflows/quyt-pages-ui-review.yml'
permissions:
  contents: read
jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native Node source/amount fixture (synthetic)
        run: |
          node --test tests/quyt-main-review-entry.test.cjs tests/quyt-preview-pages-safety.test.cjs tests/quyt-one-screen-money-review.test.cjs tests/quyt-one-screen-owner-rounding.test.cjs tests/quyt-cut-review-contract.cjs tests/quyt-pwa-sw-route-boundary.test.cjs tests/quyt-pwa-grouped-frames.test.js tests/quyt-pwa-integer-rounding.test.js tests/quyt-pwa-missing-unit.test.js tests/quyt-pwa-telegram-envelope.test.js tests/quyt-main-source-cut-contract.cjs
      - name: Actual Chromium browser DOM lifecycle with synthetic bets
        run: |
          command -v google-chrome || command -v chromium
          node tests/quyt-pwa-main-visibility-headless.cjs
          node tests/quyt-main-source-cut-f5.cjs

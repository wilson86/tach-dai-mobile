name: KTS Settlement Team M0 isolated contract QA
on:
  pull_request:
    paths:
      - 'team-settlement/**'
      - 'docs/settlement-team/**'
      - 'tests/settlement-team-*.test.cjs'
      - 'tests/settlement-sync-contract.test.cjs'
      - '.github/workflows/settlement-team-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Node contract and schema source tests (synthetic only)
        run: node --test tests/settlement-team-*.test.cjs tests/settlement-sync-contract.test.cjs
      - name: No production or paid deploy tasks
        run: |
          echo "TEAM_CONTRACT_QA_ONLY=PASS"
          echo "POSTGRES_DATABASE_TEST=SEE_SEPARATE_POSTGRES_JOB"
          echo "AUTH_HTTP_TEST=NOT_RUN"
          echo "REAL_HIOSKT_ORACLE=BLOCKED"
          echo "RELEASE_READINESS=BLOCKED"

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: team_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d team_contract_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: team_contract_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated schema to disposable synthetic PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f team-settlement/migrations/001_team_ledger.sql
      - name: Apply draft-only transactional SQL function in isolated database
        run: psql -X -v ON_ERROR_STOP=1 -f team-settlement/migrations/002_draft_transaction.sql
      - name: Apply isolated auth/session persistence candidate
        run: psql -X -v ON_ERROR_STOP=1 -f team-settlement/migrations/003_auth_session.sql
      - name: Verify RLS tenant isolation, immutable events and idempotency constraints
        run: psql -X -v ON_ERROR_STOP=1 -f team-settlement/tests/postgres-smoke.sql
      - name: Verify atomic draft idempotency, CAS and role denied
        run: psql -X -v ON_ERROR_STOP=1 -f team-settlement/tests/postgres-draft.sql
      - name: Race 30 synthetic clients on one scope revision
        run: bash team-settlement/tests/concurrent-30.sh
      - name: Prove commit-order feed for two parallel scopes in same workspace
        run: bash team-settlement/tests/concurrent-workspace-feed.sh
      - name: Verify synthetic auth/session persistence boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f team-settlement/tests/postgres-auth.sql

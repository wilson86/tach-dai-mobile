# Qualification workflow for settlement pre-production evidence path.
name: Qualify Settlement PWA

on:
  push:
    branches:
      - feature/settlement-pwa-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Existing Mobile regression
        run: node tests/regression-tests.js

      - name: Settlement engine golden tests
        run: node tests/settlement-engine-tests.js

      - name: Settlement permission gate tests
        run: node tests/settlement-feature-gates-tests.js

      - name: Settlement runtime gate tests

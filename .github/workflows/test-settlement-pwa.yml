name: Qualify Settlement PWA

on:
  push:
    branches:
      - feature/settlement-pwa-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Existing Mobile regression
        run: node tests/regression-tests.js

      - name: Settlement engine golden tests
        run: node tests/settlement-engine-tests.js

      - name: Settlement permission gate tests
        run: node tests/settlement-feature-gates-tests.js

      - name: Settlement runtime gate tests
        run: node tests/settlement-runtime-tests.js

      - name: Settlement research fallback tests
        run: node tests/settlement-research-defaults-tests.js

      - name: Settlement category map tests
        run: node tests/settlement-category-map-tests.js

      - name: Settlement MB oracle tests
        run: node tests/settlement-mb-oracle-tests.js

      - name: Settlement MB canonical evaluator tests
        run: node tests/settlement-evaluator-tests.js

      - name: Settlement MN MT evaluator golden tests
        run: node tests/settlement-mn-mt-evaluator-tests.js

      - name: Settlement parser provider tests
        run: node tests/settlement-parser-provider-tests.js

      - name: Settlement pipeline tests
        run: node tests/settlement-pipeline-tests.js

      - name: Settlement report tests
        run: node tests/settlement-report-tests.js

      - name: Settlement report dashboard tests
        run: node tests/settlement-report-dashboard-tests.js

      - name: Settlement daily attention tests
        run: node tests/settlement-attention-ui-tests.js

      - name: Settlement shadow comparison tests
        run: node tests/settlement-shadow-tests.js

      - name: Settlement shadow persistence tests
        run: node tests/settlement-shadow-runtime-tests.js

      - name: Settlement shadow regression case tests
        run: node tests/settlement-regression-cases-tests.js

      - name: Settlement regression candidate tests
        run: node tests/settlement-regression-candidates-tests.js

      - name: Settlement regression candidate wiring tests
        run: node tests/settlement-regression-candidates-wiring-tests.js

      - name: Settlement regression mismatch clustering tests
        run: node tests/settlement-regression-review-tests.js

      - name: Settlement regression review wiring tests
        run: node tests/settlement-regression-review-wiring-tests.js

      - name: Settlement shadow repair workflow tests
        run: node tests/settlement-repair-workflow-tests.js

      - name: Settlement shadow repair wiring tests
        run: node tests/settlement-repair-wiring-tests.js

      - name: Settlement current parser replay tests
        run: node tests/settlement-parser-replay-tests.js

      - name: Settlement current parser replay wiring tests
        run: node tests/settlement-parser-replay-wiring-tests.js

      - name: Committed shadow regression fixtures
        run: node tests/shadow-regression-fixture-runner.js

      - name: Settlement shadow recalculation guard tests
        run: node tests/settlement-shadow-guard-tests.js

      - name: Settlement shadow mismatch UI tests
        run: node tests/settlement-shadow-ui-tests.js

      - name: Settlement batch shadow tests
        run: node tests/settlement-shadow-batch-tests.js

      - name: Settlement batch shadow wiring tests
        run: node tests/settlement-shadow-batch-wiring-tests.js

      - name: Settlement shadow observation tests
        run: node tests/settlement-observation-tests.js

      - name: Settlement message history tests
        run: node tests/settlement-message-history-tests.js

      - name: Settlement page tests
        run: node tests/settlement-page-tests.js

      - name: Settlement scope synchronization tests
        run: node tests/settlement-scope-sync-tests.js

      - name: Settlement store normalization tests
        run: node tests/settlement-store-normalization-tests.js

      - name: KQXS result service tests
        run: node tests/result-service-tests.js

      - name: KQXS result provider tests
        run: node tests/result-provider-tests.js

      - name: KQXS automatic scope polling tests
        run: node tests/result-auto-tests.js

      - name: KQXS correction audit tests
        run: node tests/result-audit-ui-tests.js

name: Deploy GitHub Pages Test

on:
  push:
    branches: [deploy/settlement-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: settlement-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: settlement-test-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public settlement test bytes
        shell: bash
        env:
          SETTLEMENT_TEST_URL: https://wilson86.github.io/tach-dai-mobile/settlement-test
        run: |
          set -euo pipefail
          mapfile -t files < <(find settlement-test -maxdepth 1 -type f \( -name '*.js' -o -name '*.html' -o -name '*.json' -o -name '*.webmanifest' \) | sort)
          if [ "${#files[@]}" -lt 60 ]; then
            echo "Unexpectedly small settlement-test surface: ${#files[@]} files" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for attempt in 1 2 3 4 5; do
            echo "Public Pages parity attempt $attempt/5"
            rm -rf "$tmp/downloaded"
            mkdir -p "$tmp/downloaded"
            failed=0

            for local_path in "${files[@]}"; do
              name="${local_path#settlement-test/}"
              public_url="${SETTLEMENT_TEST_URL}/${name}?sha=${GITHUB_SHA}"
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$public_url" -o "$tmp/downloaded/$name"; then
                echo "FETCH_FAIL $name" >&2
                failed=1
                continue
              fi

              expected="$(git hash-object "$local_path")"
              actual="$(git hash-object "$tmp/downloaded/$name")"
              if [ "$expected" != "$actual" ]; then
                echo "HASH_MISMATCH $name expected=$expected actual=$actual" >&2
                failed=1
              fi
            done

            if [ "$failed" -eq 0 ]; then
              echo "PUBLIC_PAGES_PARITY=PASS files=${#files[@]} sha=${GITHUB_SHA}"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 3
            fi
          done

          echo "PUBLIC_PAGES_PARITY=FAIL sha=${GITHUB_SHA}" >&2
          exit 1

      - name: Verify settlement test backend contract
        shell: bash
        env:
          SETTLEMENT_API_BASE: https://kts-settlement-api-test.onrender.com
          ALLOWED_ORIGIN: https://wilson86.github.io
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl_common=(
            --fail --silent --show-error --location
            --retry 4 --retry-delay 2 --retry-all-errors
            --connect-timeout 10 --max-time 40
          )

          curl "${curl_common[@]}" \
            -D "$tmp/health.headers" \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            "${SETTLEMENT_API_BASE}/health" \
            -o "$tmp/health.json"

          python3 - "$tmp/health.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('service')=='kts-settlement-api', p
          assert p.get('kqxs_provider_mode')=='dual-public-web', p
          assert p.get('kqxs_cross_source_verification') is True, p
          assert p.get('parser_identity_path')=='/api/settlement/parser-identity', p
          PY

          cors="$(awk 'BEGIN{IGNORECASE=1}/^Access-Control-Allow-Origin:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/health.headers")"
          if [ "$cors" != "$ALLOWED_ORIGIN" ]; then
            echo "BACKEND_CORS_HEALTH_MISMATCH expected=$ALLOWED_ORIGIN actual=$cors" >&2
            exit 1
          fi

          status="$(curl --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 40 \
            -o /dev/null -D "$tmp/options.headers" -w '%{http_code}' \
            -X OPTIONS \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            -H 'Access-Control-Request-Method: POST' \
            "${SETTLEMENT_API_BASE}/api/settlement/parse")"
          if [ "$status" != "204" ]; then
            echo "BACKEND_CORS_PREFLIGHT_STATUS=$status" >&2
            exit 1
          fi

          cors="$(awk 'BEGIN{IGNORECASE=1}/^Access-Control-Allow-Origin:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/options.headers")"
          if [ "$cors" != "$ALLOWED_ORIGIN" ]; then
            echo "BACKEND_CORS_PREFLIGHT_MISMATCH expected=$ALLOWED_ORIGIN actual=$cors" >&2
            exit 1
          fi

          curl "${curl_common[@]}" \
            -D "$tmp/identity.headers" \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            "${SETTLEMENT_API_BASE}/api/settlement/parser-identity" \
            -o "$tmp/identity.json"

          python3 - "$tmp/identity.json" <<'PY'
          import json, re, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('identity_contract')=='kts-parser-identity-v1', p
          ids=p.get('identities') or {}
          for key in ('mb','mn_mt'):
              row=ids.get(key) or {}
              value=str(row.get('identity_sha256') or '')
              assert re.fullmatch(r'[0-9a-f]{64}',value), (key,row)
          PY

          cors="$(awk 'BEGIN{IGNORECASE=1}/^Access-Control-Allow-Origin:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/identity.headers")"
          if [ "$cors" != "$ALLOWED_ORIGIN" ]; then
            echo "BACKEND_CORS_IDENTITY_MISMATCH expected=$ALLOWED_ORIGIN actual=$cors" >&2
            exit 1
          fi

          curl "${curl_common[@]}" \
            -D "$tmp/parse.headers" \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            -H 'Content-Type: application/json' \
            --data '{"region":"mb","raw_text":"92 61 da 1n"}' \
            "${SETTLEMENT_API_BASE}/api/settlement/parse" \
            -o "$tmp/parse.json"

          python3 - "$tmp/parse.json" <<'PY'
          import json, re, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          canonical=p.get('canonical_payload') or {}
          legs=canonical.get('legs') or []
          assert legs and legs[0].get('code')=='DAT', p
          identity=canonical.get('parser_identity') or {}
          assert re.fullmatch(r'[0-9a-f]{64}',str(identity.get('identity_sha256') or '')), identity
          PY

          cors="$(awk 'BEGIN{IGNORECASE=1}/^Access-Control-Allow-Origin:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/parse.headers")"
          cache_control="$(awk 'BEGIN{IGNORECASE=1}/^Cache-Control:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/parse.headers")"
          if [ "$cors" != "$ALLOWED_ORIGIN" ]; then
            echo "BACKEND_CORS_PARSE_MISMATCH expected=$ALLOWED_ORIGIN actual=$cors" >&2
            exit 1
          fi
          if [ "$cache_control" != "no-store" ]; then
            echo "BACKEND_PARSE_CACHE_CONTROL_MISMATCH actual=$cache_control" >&2
            exit 1
          fi

          status="$(curl --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 40 \
            -o /dev/null -D "$tmp/kqxs-options.headers" -w '%{http_code}' \
            -X OPTIONS \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            -H 'Access-Control-Request-Method: GET' \
            "${SETTLEMENT_API_BASE}/api/kqxs")"
          if [ "$status" != "204" ]; then
            echo "BACKEND_KQXS_CORS_PREFLIGHT_STATUS=$status" >&2
            exit 1
          fi

          cors="$(awk 'BEGIN{IGNORECASE=1}/^Access-Control-Allow-Origin:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/kqxs-options.headers")"
          if [ "$cors" != "$ALLOWED_ORIGIN" ]; then
            echo "BACKEND_KQXS_CORS_PREFLIGHT_MISMATCH expected=$ALLOWED_ORIGIN actual=$cors" >&2
            exit 1
          fi

          curl "${curl_common[@]}" \
            -D "$tmp/parse-mn.headers" \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            -H 'Content-Type: application/json' \
            --data '{"region":"mn","business_date":"2026-10-04","raw_text":"tg 75 b 1n"}' \
            "${SETTLEMENT_API_BASE}/api/settlement/parse" \
            -o "$tmp/parse-mn.json"

          python3 - "$tmp/parse-mn.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          canonical=p.get('canonical_payload') or {}
          assert canonical.get('region')=='mn', p
          legs=canonical.get('legs') or []
          assert legs, p
          assert list(legs[0].get('station_codes') or [])==['tg'], p
          PY

          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 40 \
            -o "$tmp/parse-mn-missing-date.json" -D "$tmp/parse-mn-missing-date.headers" -w '%{http_code}' \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            -H 'Content-Type: application/json' \
            --data '{"region":"mn","raw_text":"tg 75 b 1n"}' \
            "${SETTLEMENT_API_BASE}/api/settlement/parse")"
          if [ "$status" != "400" ]; then
            echo "BACKEND_MN_MISSING_DATE_STATUS=$status" >&2
            exit 1
          fi
          python3 - "$tmp/parse-mn-missing-date.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('error')=='BUSINESS_DATE_REQUIRED', p
          PY

          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 40 \
            -o "$tmp/kqxs-invalid-date.json" -w '%{http_code}' \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            "${SETTLEMENT_API_BASE}/api/kqxs?date=nope&region=mb")"
          if [ "$status" != "400" ]; then
            echo "BACKEND_KQXS_INVALID_DATE_STATUS=$status" >&2
            exit 1
          fi
          python3 - "$tmp/kqxs-invalid-date.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('error')=='KQXS_DATE_REQUIRED', p
          PY

          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 40 \
            -o "$tmp/kqxs-invalid-region.json" -w '%{http_code}' \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            "${SETTLEMENT_API_BASE}/api/kqxs?date=2026-09-22&region=xx")"
          if [ "$status" != "400" ]; then
            echo "BACKEND_KQXS_INVALID_REGION_STATUS=$status" >&2
            exit 1
          fi
          python3 - "$tmp/kqxs-invalid-region.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p.get('error')=='KQXS_REGION_REQUIRED', p
          PY

          curl --silent --show-error \
            --connect-timeout 10 --max-time 40 \
            -D "$tmp/wrong-origin.headers" \
            -H 'Origin: https://example.invalid' \
            "${SETTLEMENT_API_BASE}/health" \
            -o /dev/null
          wrong_cors="$(awk 'BEGIN{IGNORECASE=1}/^Access-Control-Allow-Origin:/{sub(/^[^:]+:[[:space:]]*/,"");gsub("\r","");print;exit}' "$tmp/wrong-origin.headers")"
          if [ "$wrong_cors" = "https://example.invalid" ] || [ "$wrong_cors" = "*" ]; then
            echo "BACKEND_CORS_OVERBROAD actual=$wrong_cors" >&2
            exit 1
          fi
          if [ -n "$wrong_cors" ] && [ "$wrong_cors" != "$ALLOWED_ORIGIN" ]; then
            echo "BACKEND_CORS_UNEXPECTED_VALUE actual=$wrong_cors" >&2
            exit 1
          fi

          echo "SETTLEMENT_TEST_PARSER_POST=PASS code=DAT"
          echo "SETTLEMENT_TEST_MN_PARSER=PASS station=tg"
          echo "SETTLEMENT_TEST_FAIL_CLOSED=PASS parser_date+kqxs_scope"
          echo "SETTLEMENT_TEST_CORS_RESTRICTED=PASS"
          echo "SETTLEMENT_TEST_KQXS_PREFLIGHT=PASS origin=${ALLOWED_ORIGIN}"
          echo "SETTLEMENT_TEST_BACKEND_CONTRACT=PASS origin=${ALLOWED_ORIGIN}"

      - name: Browser smoke settlement runtime
        shell: bash
        env:
          SETTLEMENT_TEST_URL: https://wilson86.github.io/tach-dai-mobile/settlement-test
        run: |
          set -euo pipefail

          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "BROWSER_SMOKE_NO_CHROME" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="${SETTLEMENT_TEST_URL}/settlement.html?sha=${GITHUB_SHA}"

          for attempt in 1 2 3; do
            echo "Browser smoke attempt $attempt/3 using $browser"
            rm -rf "$tmp/profile" "$tmp/dom.html" "$tmp/chrome.log"

            if "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$tmp/profile" \
              --virtual-time-budget=8000 \
              --dump-dom "$url" \
              >"$tmp/dom.html" 2>"$tmp/chrome.log"; then

              failed=0
              for needle in \
                'id="kqxsAutoBadge"' \
                'id="checkMessageSyntax"' \
                'id="messageParsePreview"'; do
                if ! grep -Fq "$needle" "$tmp/dom.html"; then
                  echo "BROWSER_SMOKE_MISSING_DOM $needle" >&2
                  failed=1
                fi
              done

              if grep -Fq 'Khởi tạo lỗi:' "$tmp/dom.html"; then
                echo "BROWSER_SMOKE_BOOT_ERROR" >&2
                failed=1
              fi

              if [ "$failed" -eq 0 ]; then
                echo "BROWSER_RUNTIME_SMOKE=PASS sha=${GITHUB_SHA}"
                exit 0
              fi
            else
              echo "BROWSER_SMOKE_CHROME_EXIT_FAIL attempt=$attempt" >&2
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "BROWSER_RUNTIME_SMOKE=FAIL sha=${GITHUB_SHA}" >&2
          tail -n 120 "$tmp/chrome.log" >&2 || true
          exit 1


      - name: Browser acceptance settlement iframe and API
        shell: bash
        env:
          SETTLEMENT_TEST_URL: https://wilson86.github.io/tach-dai-mobile/settlement-test
        run: |
          set -euo pipefail
          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "ACCEPTANCE_NO_CHROME" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="${SETTLEMENT_TEST_URL}/acceptance-smoke.html?sha=${GITHUB_SHA}"

          for attempt in 1 2 3; do
            echo "Browser acceptance attempt $attempt/3"
            rm -rf "$tmp/profile" "$tmp/dom.html" "$tmp/chrome.log"
            if "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$tmp/profile" \
              --virtual-time-budget=15000 \
              --dump-dom "$url" \
              >"$tmp/dom.html" 2>"$tmp/chrome.log"; then
              if grep -Fq 'ACCEPTANCE_SMOKE=PASS' "$tmp/dom.html" \
                && grep -Fq 'RUNTIME_ENDPOINTS=PASS' "$tmp/dom.html" \
                && grep -Fq 'BROWSER_CORS_PARSER=PASS code=DAT' "$tmp/dom.html" \
                && grep -Fq 'UI_MESSAGE_TAB=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_SYNTAX_REVIEW=PASS DAT' "$tmp/dom.html" \
                && grep -Fq 'UI_PARTNER_CREATE=PASS' "$tmp/dom.html" \
                && grep -Fq 'INDEXEDDB_PARTNER_PERSISTENCE=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_CONFIG_SAVE=PASS' "$tmp/dom.html" \
                && grep -Fq 'INDEXEDDB_CONFIG_PERSISTENCE=PASS' "$tmp/dom.html" \
                && grep -Fq 'CONFIG_UNCONFIRMED_GATES_OFF=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_GATE_BROWSER_LOCKED=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_GATE_LEGACY_TRUE_FAIL_CLOSED=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_MESSAGE_SAVE=PASS' "$tmp/dom.html" \
                && grep -Fq 'INDEXEDDB_MESSAGE_PERSISTENCE=PASS' "$tmp/dom.html" \
                && grep -Fq 'MESSAGE_WAITING_RESULT_FAIL_CLOSED=PASS' "$tmp/dom.html" \
                && grep -Fq 'BACKUP_EXPORT_BROWSER=PASS' "$tmp/dom.html" \
                && grep -Fq 'BACKUP_MERGE_IDEMPOTENT=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_MESSAGE_CANCEL=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_MESSAGE_RESTORE=PASS' "$tmp/dom.html" \
                && grep -Fq 'MESSAGE_SCOPE_LIFECYCLE=PASS' "$tmp/dom.html" \
                && grep -Fq 'UI_REPORT_BLOCKED=PASS' "$tmp/dom.html" \
                && grep -Fq 'REPORT_ZERO_MONEY=PASS' "$tmp/dom.html" \
                && grep -Fq 'DAILY_CLOSE_NOT_READY=PASS' "$tmp/dom.html" \
                && grep -Fq 'KQXS_VERIFIED_FIXTURE=PASS' "$tmp/dom.html" \
                && grep -Fq 'SETTLEMENT_CANONICAL_TOTALS=PASS' "$tmp/dom.html" \
                && grep -Fq 'REPORT_CANONICAL_TOTALS=PASS' "$tmp/dom.html" \
                && grep -Fq 'SHADOW_UNVERIFIED_FAIL_CLOSED=PASS' "$tmp/dom.html" \
                && grep -Fq 'DAILY_CLOSE_REQUIRES_MATCH_EXACT=PASS' "$tmp/dom.html"; then
                echo "SETTLEMENT_BROWSER_ACCEPTANCE=PASS sha=${GITHUB_SHA}"
                exit 0
              fi
              grep -o 'ACCEPTANCE_SMOKE=[^<]*' "$tmp/dom.html" >&2 || true
            else
              echo "ACCEPTANCE_CHROME_EXIT_FAIL attempt=$attempt" >&2
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done

          echo "SETTLEMENT_BROWSER_ACCEPTANCE=FAIL sha=${GITHUB_SHA}" >&2
          tail -n 120 "$tmp/chrome.log" >&2 || true
          exit 1

      - name: Verify settlement offline service-worker boot
        shell: bash
        env:
          SETTLEMENT_TEST_URL: https://wilson86.github.io/tach-dai-mobile/settlement-test
        run: |
          set -euo pipefail

          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "OFFLINE_SMOKE_NO_CHROME" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          profile="$tmp/profile"
          url="${SETTLEMENT_TEST_URL}/settlement.html?offline-smoke=${GITHUB_SHA}"

          echo "Offline smoke warm-up 1/2"
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$profile" \
            --virtual-time-budget=10000 \
            --dump-dom "$url" \
            >"$tmp/warm1.html" 2>"$tmp/warm1.log"

          echo "Offline smoke warm-up 2/2"
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$profile" \
            --virtual-time-budget=8000 \
            --dump-dom "$url" \
            >"$tmp/warm2.html" 2>"$tmp/warm2.log"

          for needle in \
            'id="kqxsAutoBadge"' \
            'id="checkMessageSyntax"' \
            'id="messageParsePreview"'; do
            if ! grep -Fq "$needle" "$tmp/warm2.html"; then
              echo "OFFLINE_SMOKE_WARMUP_MISSING_DOM $needle" >&2
              exit 1
            fi
          done

          for attempt in 1 2 3; do
            echo "Offline service-worker attempt $attempt/3"
            rm -f "$tmp/offline.html" "$tmp/offline.log"

            if "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$profile" \
              --host-resolver-rules="MAP wilson86.github.io 127.0.0.1" \
              --virtual-time-budget=8000 \
              --dump-dom "$url" \
              >"$tmp/offline.html" 2>"$tmp/offline.log"; then

              failed=0
              for needle in \
                'id="kqxsAutoBadge"' \
                'id="checkMessageSyntax"' \
                'id="messageParsePreview"'; do
                if ! grep -Fq "$needle" "$tmp/offline.html"; then
                  echo "OFFLINE_SMOKE_MISSING_DOM $needle" >&2
                  failed=1
                fi
              done

              if grep -Fq 'Khởi tạo lỗi:' "$tmp/offline.html"; then
                echo "OFFLINE_SMOKE_BOOT_ERROR" >&2
                failed=1
              fi

              if [ "$failed" -eq 0 ]; then
                echo "SETTLEMENT_OFFLINE_SW_SMOKE=PASS sha=${GITHUB_SHA}"
                exit 0
              fi
            else
              echo "OFFLINE_SMOKE_CHROME_EXIT_FAIL attempt=$attempt" >&2
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "SETTLEMENT_OFFLINE_SW_SMOKE=FAIL sha=${GITHUB_SHA}" >&2
          tail -n 120 "$tmp/offline.log" >&2 || true
          exit 1

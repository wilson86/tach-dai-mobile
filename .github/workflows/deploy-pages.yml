name: Deploy GitHub Pages Test

on:
  push:
    branches: [deploy/settlement-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: settlement-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: settlement-test-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public settlement test bytes
        shell: bash
        env:
          SETTLEMENT_TEST_URL: https://wilson86.github.io/tach-dai-mobile/settlement-test
        run: |
          set -euo pipefail
          mapfile -t files < <(find settlement-test -maxdepth 1 -type f \( -name '*.js' -o -name '*.html' -o -name '*.json' -o -name '*.webmanifest' \) | sort)
          if [ "${#files[@]}" -lt 60 ]; then
            echo "Unexpectedly small settlement-test surface: ${#files[@]} files" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for attempt in 1 2 3 4 5; do
            echo "Public Pages parity attempt $attempt/5"
            rm -rf "$tmp/downloaded"
            mkdir -p "$tmp/downloaded"
            failed=0

            for local_path in "${files[@]}"; do
              name="${local_path#settlement-test/}"
              public_url="${SETTLEMENT_TEST_URL}/${name}?sha=${GITHUB_SHA}"
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$public_url" -o "$tmp/downloaded/$name"; then
                echo "FETCH_FAIL $name" >&2
                failed=1
                continue
              fi

              expected="$(git hash-object "$local_path")"
              actual="$(git hash-object "$tmp/downloaded/$name")"
              if [ "$expected" != "$actual" ]; then
                echo "HASH_MISMATCH $name expected=$expected actual=$actual" >&2
                failed=1
              fi
            done

            if [ "$failed" -eq 0 ]; then
              echo "PUBLIC_PAGES_PARITY=PASS files=${#files[@]} sha=${GITHUB_SHA}"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 3
            fi
          done

          echo "PUBLIC_PAGES_PARITY=FAIL sha=${GITHUB_SHA}" >&2
          exit 1

      - name: Browser smoke settlement runtime
        shell: bash
        env:
          SETTLEMENT_TEST_URL: https://wilson86.github.io/tach-dai-mobile/settlement-test
        run: |
          set -euo pipefail

          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "BROWSER_SMOKE_NO_CHROME" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="${SETTLEMENT_TEST_URL}/settlement.html?sha=${GITHUB_SHA}"

          for attempt in 1 2 3; do
            echo "Browser smoke attempt $attempt/3 using $browser"
            rm -rf "$tmp/profile" "$tmp/dom.html" "$tmp/chrome.log"

            if "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$tmp/profile" \
              --virtual-time-budget=8000 \
              --dump-dom "$url" \
              >"$tmp/dom.html" 2>"$tmp/chrome.log"; then

              failed=0
              for needle in \
                'id="kqxsAutoBadge"' \
                'id="checkMessageSyntax"' \
                'id="messageParsePreview"'; do
                if ! grep -Fq "$needle" "$tmp/dom.html"; then
                  echo "BROWSER_SMOKE_MISSING_DOM $needle" >&2
                  failed=1
                fi
              done

              if grep -Fq 'Khởi tạo lỗi:' "$tmp/dom.html"; then
                echo "BROWSER_SMOKE_BOOT_ERROR" >&2
                failed=1
              fi

              if [ "$failed" -eq 0 ]; then
                echo "BROWSER_RUNTIME_SMOKE=PASS sha=${GITHUB_SHA}"
                exit 0
              fi
            else
              echo "BROWSER_SMOKE_CHROME_EXIT_FAIL attempt=$attempt" >&2
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "BROWSER_RUNTIME_SMOKE=FAIL sha=${GITHUB_SHA}" >&2
          tail -n 120 "$tmp/chrome.log" >&2 || true
          exit 1

name: Settlement feature-deploy source parity
on:
  pull_request:
    paths:
      - "settlement-test/**"
      - ".github/scripts/settlement-feature-deploy-parity.cjs"
      - ".github/workflows/settlement-feature-deploy-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deploy candidate
        uses: actions/checkout@v4
      - name: Checkout pinned feature audit candidate
        uses: actions/checkout@v4
        with:
          ref: 62bbda2c6bc19479e7c3bb6d8f97f32de7128777
          path: _feature_authority
          persist-credentials: false
      - name: Compare critical identity and settlement runtime blobs
        run: node .github/scripts/settlement-feature-deploy-parity.cjs

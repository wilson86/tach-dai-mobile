name: Run Unified shared-input desktop parity patch v2

on:
  push:
    branches:
      - feature/kts-unified-static-20261004

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[shared-input-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kts-unified-static-20261004
          fetch-depth: 0
      - name: Patch shared input and desktop/mobile parity
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          core_path=Path('app/unified-core.js')
          core=core_path.read_text(encoding='utf-8')
          core=core.replace("const UX_VERSION='1.0.4';","const UX_VERSION='1.0.5';",1)
          if 'KTS_UNIFIED_SHARED_INPUT_V1' not in core:
              core += r'''

// Unified source-input authority: Tách Đài, Tách Ngang and Đá Vòng share the
// same raw source text. Region/date were already shared; this closes the last
// desktop/mobile parity gap without touching business parsing or result state.
;(function installUnifiedSharedInput(){
  'use strict';
  if(typeof document==='undefined') return;
  const SESSION_KEY='KTS_UNIFIED_SHARED_INPUT_V1';
  let shared='';
  let syncing=false;
  const seen=new WeakMap();
  function saved(){try{return sessionStorage.getItem(SESSION_KEY)||''}catch(_){return ''}}
  function persist(value){try{sessionStorage.setItem(SESSION_KEY,value)}catch(_){}}
  function activeMode(){return document.querySelector('.tab.active')?.dataset?.mode||'tach'}
  function sources(){
    const list=[];
    try{const el=document.getElementById('tachFrame')?.contentDocument?.getElementById('input');if(el)list.push({mode:'tach',el})}catch(_){}
    try{const el=document.getElementById('ngangFrame')?.contentDocument?.getElementById('input');if(el)list.push({mode:'ngang',el})}catch(_){}
    const dv=document.getElementById('dvInput');if(dv)list.push({mode:'davong',el:dv});
    return list;
  }
  function publish(value,origin){
    if(syncing)return;
    shared=String(value??'');persist(shared);syncing=true;
    try{
      for(const item of sources()){
        if(item.el!==origin&&String(item.el.value||'')!==shared)item.el.value=shared;
        seen.set(item.el,String(item.el.value||''));
      }
    }finally{syncing=false}
  }
  function attach(item){
    const el=item.el;
    if(!el.__KTS_UNIFIED_SHARED_INPUT_V1__){
      el.addEventListener('input',()=>publish(el.value,el));
      el.addEventListener('change',()=>publish(el.value,el));
      el.__KTS_UNIFIED_SHARED_INPUT_V1__=true;
    }
    if(!seen.has(el)){
      const now=String(el.value||'');
      if(!shared&&now)publish(now,el);else if(now!==shared)el.value=shared;
      seen.set(el,String(el.value||''));
    }
  }
  function refresh(){
    const list=sources();for(const item of list)attach(item);
    const mode=activeMode();
    const ordered=[...list.filter(x=>x.mode===mode),...list.filter(x=>x.mode!==mode)];
    for(const item of ordered){
      const now=String(item.el.value||''),before=seen.get(item.el);
      if(before!==undefined&&now!==before){publish(now,item.el);break;}
    }
  }
  function install(){
    shared=saved();refresh();
    for(const id of ['tachFrame','ngangFrame'])document.getElementById(id)?.addEventListener('load',()=>setTimeout(refresh,0));
    document.querySelector('.tabs')?.addEventListener('click',()=>setTimeout(refresh,0));
    setInterval(refresh,300);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();
'''
          core_path.write_text(core,encoding='utf-8')

          vp=Path('app/version.json')
          version=json.loads(vp.read_text(encoding='utf-8'))
          version['version']='1.0.5';version['updated']='2026-10-06'
          ux=version.setdefault('ux',[])
          for item in ['shared_input_across_modes','desktop_phone_same_davong_group_ui']:
              if item not in ux:ux.append(item)
          vp.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sp=Path('app/sw.js')
          sw=sp.read_text(encoding='utf-8')
          sw=sw.replace("kts-tach-unified-v1.0.4-shared-settings-6ce6","kts-tach-unified-v1.0.5-shared-input-6ce6")
          sp.write_text(sw,encoding='utf-8')

          tp=Path('tests/unified-static-tests.js')
          tests=tp.read_text(encoding='utf-8')
          tests=tests.replace("assert.equal(version.version,'1.0.4');","assert.equal(version.version,'1.0.5');")
          tests=tests.replace(r"assert.match(sw,/kts-tach-unified-v1\.0\.4-shared-settings-6ce6/);",r"assert.match(sw,/kts-tach-unified-v1\.0\.5-shared-input-6ce6/);")
          anchor='assert.match(app,/id="dvLegacySettings" class="card mode-settings-legacy"/);'
          extra="\nconst unifiedCore=fs.readFileSync(path.join(root,'app','unified-core.js'),'utf8');\nassert.match(unifiedCore,/KTS_UNIFIED_SHARED_INPUT_V1/);\nassert.match(unifiedCore,/installUnifiedSharedInput/);\n"
          if 'installUnifiedSharedInput' not in tests:
              if anchor not in tests:raise SystemExit('test anchor missing')
              tests=tests.replace(anchor,anchor+extra,1)
          tp.write_text(tests,encoding='utf-8')
          PY
      - name: Run focused qualification
        run: |
          node tests/regression-tests.js
          node tests/unified-static-tests.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/unified-core.js app/version.json app/sw.js tests/unified-static-tests.js
          git commit -m "feat(unified): share source input across all modes [shared-input-patch]"
          git push origin HEAD:feature/kts-unified-static-20261004

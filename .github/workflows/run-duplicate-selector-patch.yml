name: Run duplicate selector fail-closed patch

on:
  push:
    branches:
      - feature/duplicate-selector-fail-closed-20261005

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/duplicate-selector-fail-closed-20261005
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch duplicate-selector validation
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function parseBetPayloadAst(rest){ return KTS_BUSINESS_ENGINE.parseBetPayloadAst(rest); }"
          new = r'''function assertNoDuplicateBetSelectors(groups){
            for(const group of groups||[]){
              const seen=new Map();
              for(const bet of group.bets||[]){
                const key=String(bet.selector||'').toLowerCase();
                if(seen.has(key)){
                  const first=seen.get(key);
                  throw new Error(`lặp cú pháp '${bet.selector}': sau ${first.selector}${first.amount} phải có số mới trước ${bet.selector}${bet.amount}`);
                }
                seen.set(key,bet);
              }
            }
            return groups;
          }
          function parseBetPayloadAst(rest){
            return assertNoDuplicateBetSelectors(KTS_BUSINESS_ENGINE.parseBetPayloadAst(rest));
          }'''
          if old not in s:
              raise SystemExit('expected parseBetPayloadAst wrapper not found')
          s = s.replace(old, new, 1)
          s = s.replace('v2.0.20</span>', 'v2.0.21</span>', 1)
          p.write_text(s, encoding='utf-8')

          vp = Path('version.json')
          v = json.loads(vp.read_text(encoding='utf-8'))
          if v.get('version') != '2.0.20':
              raise SystemExit(f"unexpected version {v.get('version')}")
          v['version'] = '2.0.21'
          v['updated'] = '2026-10-05'
          v['notes'] = "Fail closed when the same betting selector is repeated for one number group without a new number group; e.g. 322 b5n b30n is rejected. Existing mixed selectors such as b + da remain valid; business engine 6ce6 unchanged."
          vp.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sp = Path('sw.js')
          sw = sp.read_text(encoding='utf-8')
          sw = sw.replace('tach-dai-mobile-v2.0.20-cut-sync', 'tach-dai-mobile-v2.0.21-duplicate-selector')
          sw = sw.replace('version:\"2.0.20\"', 'version:\"2.0.21\"')
          if 'v2.0.21-duplicate-selector' not in sw:
              raise SystemExit('service worker cache bump failed')
          sp.write_text(sw, encoding='utf-8')

          tp = Path('tests/duplicate-selector-tests.js')
          tp.parent.mkdir(parents=True, exist_ok=True)
          tp.write_text(r'''const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          vm.runInThisContext(fs.readFileSync('business_engine.generated.js','utf8'));
          const html=fs.readFileSync('index.html','utf8');
          assert(html.includes('function assertNoDuplicateBetSelectors(groups)'));
          assert(html.includes("sau ${first.selector}${first.amount} phải có số mới trước ${bet.selector}${bet.amount}"));
          function guard(groups){
            for(const group of groups||[]){
              const seen=new Map();
              for(const bet of group.bets||[]){
                const key=String(bet.selector||'').toLowerCase();
                if(seen.has(key)) throw new Error('duplicate selector');
                seen.set(key,bet);
              }
            }
            return groups;
          }
          assert.throws(()=>guard(KTS_BUSINESS_ENGINE.parseBetPayloadAst('322 b5n b30n')),/duplicate selector/);
          assert.throws(()=>guard(KTS_BUSINESS_ENGINE.parseBetPayloadAst('322 b 5n b 30n')),/duplicate selector/);
          assert.doesNotThrow(()=>guard(KTS_BUSINESS_ENGINE.parseBetPayloadAst('322 b5n da5n')));
          assert.doesNotThrow(()=>guard(KTS_BUSINESS_ENGINE.parseBetPayloadAst('322 b5n 123 b30n')));
          assert.strictEqual(KTS_BUSINESS_ENGINE.ENGINE_SHA256,'6ce6fca5adbaaf7604e21ac91e0fcb7759201b53afd0d7d1d5ef2a9bf546837c');
          console.log('duplicate-selector-tests PASS');
          ''', encoding='utf-8')
      - name: Run focused tests
        run: |
          node tests/duplicate-selector-tests.js
          node tests/regression-tests.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json sw.js tests/duplicate-selector-tests.js
          git diff --cached --check
          git commit -m "fix(mobile): reject repeated selector without new numbers"
          git push origin HEAD:feature/duplicate-selector-fail-closed-20261005

name: Run shared unified settings patch
on:
  push:
    branches: [feature/unified-shared-region-date-20261005]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-shared-region-date-20261005
      - name: Apply patch
        run: python tools/patch_unified_shared_settings_20261005.py
      - name: Syntax check Unified app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          assert scripts, 'inline script missing'
          Path('/tmp/unified-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/unified-inline.js
      - name: Focused regression
        run: |
          node tests/regression-tests.js
          node tests/unified-static-tests.js
      - name: Commit on pass
        run: |
          rm -f tools/patch_unified_shared_settings_20261005.py .github/workflows/run-shared-settings-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(unified): share region and date across all modes"
          git push origin HEAD:feature/unified-shared-region-date-20261005

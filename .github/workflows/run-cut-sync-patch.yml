name: Run cut sync patch
on:
  push:
    branches:
      - feature/cut-clipboard-sync-20261005
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cut-clipboard-sync-20261005
      - name: Apply patch
        run: python tools/patch_cut_sync_20261005.py
      - name: Focused tests
        run: |
          node tests/regression-tests.js
          node tests/unified-static-tests.js
      - name: Commit on pass
        run: |
          rm tools/patch_cut_sync_20261005.py .github/workflows/run-cut-sync-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mobile): make cut clipboard and source sync reliable"
          git push origin HEAD:feature/cut-clipboard-sync-20261005

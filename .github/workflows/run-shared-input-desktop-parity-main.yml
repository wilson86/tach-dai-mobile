name: Run Unified desktop parity patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Skip if patch commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[desktop-parity-patch\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply patch
        if: steps.guard.outputs.skip != 'true'
        run: python3 .github/patch_shared_input_desktop_parity.py
      - name: Focused qualification
        if: steps.guard.outputs.skip != 'true'
        run: |
          node tests/regression-tests.js
          node tests/unified-static-tests.js
      - name: Commit patch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/unified-core.js app/version.json app/sw.js tests/unified-static-tests.js
          git commit -m "feat(unified): sync source across tabs on desktop and phone [desktop-parity-patch]"
          git push origin HEAD:main

name: Patch cut clipboard sync once
on:
  push:
    branches: [feature/cut-clipboard-sync-20261005]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cut-clipboard-sync-20261005
      - name: Patch standalone and Unified cut UX
        shell: python
        run: |
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''function selectAllText(textarea){
            if(!textarea) return;
            try{textarea.focus({preventScroll:true});}catch(_){textarea.focus();}
            if(typeof textarea.setSelectionRange==="function") textarea.setSelectionRange(0,textarea.value.length);
            else if(typeof textarea.select==="function") textarea.select();
          }'''
          new='''function selectAllText(textarea){
            if(!textarea) return;
            try{textarea.focus({preventScroll:true});}catch(_){textarea.focus();}
            if(typeof textarea.setSelectionRange==="function") textarea.setSelectionRange(0,textarea.value.length);
            else if(typeof textarea.select==="function") textarea.select();
            if(textarea===outputEl) lastOutputSelection={start:0,end:textarea.value.length};
          }'''
          assert old in s, 'standalone selectAllText anchor missing'
          s=s.replace(old,new,1)
          old='''async function cutSelectedOutput(){
            const indexes=selectedAliveRecordIndexes();
            if(!indexes.length){
              setStatus("Hãy bôi đen dòng kết quả cần cắt trước.","err");
              return;
            }

            snapshot();
            const selectedText=indexes.map(i=>outputRecords[i].text).join("\\n");
            await writeClipboardText(selectedText);

            const inputBefore=inputEl.value;
            indexes.forEach(i=>{ outputRecords[i].alive=false; });
            deleteCompletedSourceLines();
            renderOutputRecords();

            lastOutputSelection={start:0,end:0};
            if(inputEl.value!==inputBefore){
              setStatus(`Đã cắt ${indexes.length} dòng • đã xóa tin gốc tương ứng`,"ok");
            }else{
              setStatus(`Đã cắt ${indexes.length} dòng • tin gốc vẫn giữ vì chưa cắt đủ`,"ok");
            }
          }'''
          new='''async function cutSelectedOutput(){
            rememberOutputSelection();
            const indexes=selectedAliveRecordIndexes();
            if(!indexes.length){
              setStatus("Hãy bôi đen dòng kết quả cần cắt trước.","err");
              return;
            }

            const selectedText=indexes.map(i=>outputRecords[i].text).join("\\n");
            const copied=await writeClipboardText(selectedText);
            if(!copied){
              setStatus("Không thể ghi phần đã cắt vào bộ nhớ tạm. Tin chưa bị xóa.","err");
              return;
            }

            snapshot();
            const inputBefore=inputEl.value;
            indexes.forEach(i=>{ outputRecords[i].alive=false; });
            deleteCompletedSourceLines();
            renderOutputRecords();

            lastOutputSelection={start:0,end:0};
            if(inputEl.value!==inputBefore){
              setStatus(`Đã cắt ${indexes.length} dòng • đã copy • đã xóa tin gốc tương ứng`,"ok");
            }else{
              setStatus(`Đã cắt ${indexes.length} dòng • đã copy • tin gốc giữ đến khi cắt hết kết quả của tin đó`,"ok");
            }
          }'''
          assert old in s, 'standalone cutSelectedOutput anchor missing'
          s=s.replace(old,new,1)
          s=s.replace('2.0.19','2.0.20')
          p.write_text(s,encoding='utf-8')

          vp=Path('version.json')
          v=json.loads(vp.read_text(encoding='utf-8'))
          v['version']='2.0.20'
          v['updated']='2026-10-05'
          v['notes']='Standalone Tách Đài makes Cut fail-closed on clipboard write, preserves selection across button focus, and removes source only after all derived outputs are cut; business engine unchanged.'
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          sp=Path('sw.js')
          sw=sp.read_text(encoding='utf-8').replace('tach-dai-mobile-v2.0.19-select-all','tach-dai-mobile-v2.0.20-cut-sync').replace('version:"2.0.19"','version:"2.0.20"')
          sp.write_text(sw,encoding='utf-8')

          ap=Path('app/index.html')
          a=ap.read_text(encoding='utf-8')
          a=a.replace('<iframe id="tachFrame" class="frame" src="../" title="Tách Đài 3 Miền"></iframe>','<iframe id="tachFrame" class="frame" src="../" title="Tách Đài 3 Miền" allow="clipboard-write"></iframe>')
          a=a.replace('<iframe id="ngangFrame" class="frame" src="https://wilson86.github.io/tach-dai-ngang/" title="Tách Đài Ngang 3 Miền"></iframe>','<iframe id="ngangFrame" class="frame" src="https://wilson86.github.io/tach-dai-ngang/" title="Tách Đài Ngang 3 Miền" allow="clipboard-write"></iframe>')
          old="""function selectAllText(el){if(!el)return;el.focus();if(typeof el.setSelectionRange==='function')el.setSelectionRange(0,String(el.value||'').length)}"""
          new="""let dvLastSelection={start:0,end:0};
          function rememberDvSelection(){const el=$('dvOutput'),a=el.selectionStart??0,b=el.selectionEnd??a;if(b>a)dvLastSelection={start:a,end:b}}
          function selectAllText(el){if(!el)return;el.focus();if(typeof el.setSelectionRange==='function')el.setSelectionRange(0,String(el.value||'').length);if(el===$('dvOutput'))dvLastSelection={start:0,end:String(el.value||'').length}}
          async function writeDvClipboardText(text){
            if(!text)return false;
            try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);return true}}catch(_){}
            const tmp=document.createElement('textarea');tmp.value=text;tmp.style.position='fixed';tmp.style.left='-9999px';document.body.appendChild(tmp);tmp.focus();tmp.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}tmp.remove();return !!ok;
          }"""
          assert old in a, 'unified selectAllText anchor missing'
          a=a.replace(old,new,1)
          old="""$('dvCutSelection').addEventListener('click',()=>{const el=$('dvOutput'),a=el.selectionStart,b=el.selectionEnd;if(!(b>a)){setDvStatus('Chưa chọn phần kết quả cần cắt.','err');return}el.value=el.value.slice(0,a)+el.value.slice(b);el.setSelectionRange(a,a);const count=bettingPayloadFromDisplay(el.value).split(/\\r?\\n/).filter(Boolean).length;$('dvResultLabel').textContent=`Kết quả (${count})`;setDvStatus(`Đã cắt phần chọn · còn ${count} tin`,'ok')});"""
          new="""$('dvOutput').addEventListener('select',rememberDvSelection);
          $('dvOutput').addEventListener('mouseup',rememberDvSelection);
          $('dvOutput').addEventListener('touchend',()=>setTimeout(rememberDvSelection,0));
          $('dvCutSelection').addEventListener('pointerdown',rememberDvSelection);
          $('dvCutSelection').addEventListener('touchstart',rememberDvSelection,{passive:true});
          $('dvCutSelection').addEventListener('click',async()=>{
            const el=$('dvOutput');rememberDvSelection();
            let a=dvLastSelection.start,b=dvLastSelection.end;
            const ca=el.selectionStart??0,cb=el.selectionEnd??ca;if(cb>ca){a=ca;b=cb}
            if(!(b>a)){setDvStatus('Chưa chọn phần kết quả cần cắt.','err');return}
            const selectedPayload=bettingPayloadFromDisplay(el.value.slice(a,b));
            if(!selectedPayload){setDvStatus('Phần chọn không có tin cược để cắt.','err');return}
            const copied=await writeDvClipboardText(selectedPayload);
            if(!copied){setDvStatus('Không thể ghi phần đã cắt vào bộ nhớ tạm. Tin chưa bị xóa.','err');return}
            el.value=el.value.slice(0,a)+el.value.slice(b);el.setSelectionRange(a,a);dvLastSelection={start:0,end:0};
            const count=bettingPayloadFromDisplay(el.value).split(/\\r?\\n/).filter(Boolean).length;
            if(count===0)$('dvInput').value='';
            $('dvResultLabel').textContent=`Kết quả (${count})`;
            setDvStatus(count===0?'Đã cắt + copy · đã xóa tin gốc':'Đã cắt + copy · tin gốc giữ đến khi cắt hết kết quả của tin đó','ok');
          });"""
          assert old in a, 'unified cut anchor missing'
          a=a.replace(old,new,1)
          a=a.replace("$('dvCopy').addEventListener('click',async()=>{const text=bettingPayloadFromDisplay($('dvOutput').value);if(!text)return;try{await navigator.clipboard.writeText(text);setDvStatus('Đã copy kết quả cược (không kèm gạch phân nhóm)','ok')}catch(_){const el=$('dvOutput'),old=el.value;el.removeAttribute('readonly');el.value=text;el.select();document.execCommand('copy');el.value=old;el.setAttribute('readonly','');setDvStatus('Đã copy kết quả cược (không kèm gạch phân nhóm)','ok')}});","$('dvCopy').addEventListener('click',async()=>{const text=bettingPayloadFromDisplay($('dvOutput').value);if(!text)return;const ok=await writeDvClipboardText(text);setDvStatus(ok?'Đã copy kết quả cược (không kèm gạch phân nhóm)':'Không thể ghi bộ nhớ tạm.',ok?'ok':'err')});")
          a=a.replace('Unified 1.0.2','Unified 1.0.3')
          ap.write_text(a,encoding='utf-8')

          avp=Path('app/version.json')
          av=json.loads(avp.read_text(encoding='utf-8'));av['version']='1.0.3';av['updated']='2026-10-05';av.setdefault('ux',[])
          for x in ['cut_copies_clipboard','cut_clears_source_when_complete','iframe_clipboard_write_permission']:
            if x not in av['ux']:av['ux'].append(x)
          avp.write_text(json.dumps(av,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          acp=Path('app/unified-core.js')
          ac=acp.read_text(encoding='utf-8').replace("const UX_VERSION='1.0.2';","const UX_VERSION='1.0.3';")
          acp.write_text(ac,encoding='utf-8')

          asw=Path('app/sw.js')
          aws=asw.read_text(encoding='utf-8').replace('kts-tach-unified-v1.0.2-da-vong-final-6ce6','kts-tach-unified-v1.0.3-cut-sync-6ce6').replace('version:"1.0.2"','version:"1.0.3"')
          asw.write_text(aws,encoding='utf-8')

          tp=Path('tests/regression-tests.js')
          t=tp.read_text(encoding='utf-8')
          anchor='''// PWA audit: các file và version phải đồng bộ, paths tương đối cho GitHub Pages.'''
          insert='''// Select All -> Cut phải copy toàn bộ output và xóa source khi đã cắt hết output của source.\nui.input.value = "2d 22 10 dd 5n";\nrules.run();\nconst allBeforeCut = ui.output.value;\ndocument.getElementById("selectAllOutputBtn").trigger("click");\nawait rules.cutSelectedOutput();\nassert.equal(rules.clipboard.text, allBeforeCut);\nassert.equal(ui.input.value, "");\nassert.equal(ui.output.value, "");\n\n'''
          assert anchor in t
          t=t.replace(anchor,insert+anchor,1)
          tp.write_text(t,encoding='utf-8')

          utp=Path('tests/unified-static-tests.js')
          u=utp.read_text(encoding='utf-8')
          u += '''\n// Cut/clipboard regression contract.\nassert.match(indexHtml, /allow="clipboard-write"/);\nassert.match(indexHtml, /writeDvClipboardText/);\nassert.match(indexHtml, /Không thể ghi phần đã cắt vào bộ nhớ tạm/);\nassert.match(indexHtml, /if\(count===0\)\$\('dvInput'\)\.value=''/);\nassert.equal(version.version, '1.0.3');\n'''
          utp.write_text(u,encoding='utf-8')

          Path('.github/workflows/patch-cut-sync-once.yml').unlink()
      - name: Test
        run: |
          node tests/regression-tests.js
          node tests/unified-static-tests.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json sw.js app/index.html app/version.json app/sw.js app/unified-core.js tests/regression-tests.js tests/unified-static-tests.js .github/workflows/patch-cut-sync-once.yml
          git commit -m "fix(mobile): make cut copy and source sync reliable"
          git push origin HEAD:feature/cut-clipboard-sync-20261005

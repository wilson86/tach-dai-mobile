<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>KTS Settlement Acceptance Smoke</title>
<style>body{font-family:system-ui,sans-serif;margin:12px}#app{width:100%;height:720px;border:1px solid #ccc}#result{white-space:pre-wrap;font:13px/1.45 ui-monospace,monospace}</style>
</head>
<body>
<pre id="result">ACCEPTANCE_SMOKE=PENDING</pre>
<iframe id="app" src="./settlement.html?acceptance-smoke=1"></iframe>
<script>
(async()=>{
  const out=document.getElementById('result');
  const frame=document.getElementById('app');
  const fail=(m)=>{throw new Error(m);};
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('IFRAME_LOAD_TIMEOUT')),15000);
    frame.addEventListener('load',()=>{clearTimeout(timer);resolve();},{once:true});
  });

  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!w||!d)fail('IFRAME_ACCESS_FAILED');
  if(d.body && d.body.textContent.includes('Khởi tạo lỗi:'))fail('SETTLEMENT_BOOT_ERROR');

  const cfg=w.KTS_SETTLEMENT_RUNTIME_ENDPOINTS||{};
  const api='https://kts-settlement-api-test.onrender.com';
  const expectedParser=api+'/api/settlement/parse';
  const expectedKqxs=api+'/api/kqxs';
  if(cfg.parser_endpoint!==expectedParser)fail('PARSER_ENDPOINT_CONFIG_MISMATCH:'+String(cfg.parser_endpoint||''));
  if(cfg.kqxs_endpoint!==expectedKqxs)fail('KQXS_ENDPOINT_CONFIG_MISMATCH:'+String(cfg.kqxs_endpoint||''));

  const parserInput=d.getElementById('parserEndpoint');
  const resultInput=d.getElementById('resultEndpoint');
  if(!parserInput||parserInput.value!==expectedParser)fail('PARSER_ENDPOINT_UI_MISMATCH');
  if(!resultInput||resultInput.value!==expectedKqxs)fail('KQXS_ENDPOINT_UI_MISMATCH');
  for(const id of ['kqxsAutoBadge','checkMessageSyntax','messageParsePreview']){
    if(!d.getElementById(id))fail('MISSING_DYNAMIC_DOM:'+id);
  }

  const health=await fetch(api+'/health',{cache:'no-store'});
  if(!health.ok)fail('HEALTH_HTTP_'+health.status);
  const healthJson=await health.json();
  if(healthJson.ok!==true||healthJson.service!=='kts-settlement-api')fail('HEALTH_CONTRACT');

  const identity=await fetch(api+'/api/settlement/parser-identity',{cache:'no-store'});
  if(!identity.ok)fail('IDENTITY_HTTP_'+identity.status);
  const identityJson=await identity.json();
  if(identityJson.ok!==true||identityJson.identity_contract!=='kts-parser-identity-v1')fail('IDENTITY_CONTRACT');

  const parsed=await fetch(expectedParser,{
    method:'POST',
    cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({region:'mb',raw_text:'92 61 da 1n'})
  });
  if(!parsed.ok)fail('PARSER_HTTP_'+parsed.status);
  const parsedJson=await parsed.json();
  const legs=parsedJson&&parsedJson.canonical_payload&&parsedJson.canonical_payload.legs||[];
  if(!legs.length||legs[0].code!=='DAT')fail('PARSER_CANONICAL_DAT');

  const messageTab=d.querySelector('.nav button[data-pane="message"]');
  const messagePane=d.getElementById('pane-message');
  const messageDate=d.getElementById('messageDate');
  const messageRegion=d.getElementById('messageRegion');
  const messageText=d.getElementById('messageText');
  const syntaxButton=d.getElementById('checkMessageSyntax');
  const preview=d.getElementById('messageParsePreview');
  if(!messageTab||!messagePane||!messageDate||!messageRegion||!messageText||!syntaxButton||!preview){
    fail('MESSAGE_UI_REQUIRED');
  }

  messageTab.click();
  if(!messagePane.classList.contains('active'))fail('MESSAGE_TAB_NOT_ACTIVE');
  messageDate.value='2026-10-08';
  messageRegion.value='mb';
  messageRegion.dispatchEvent(new w.Event('change',{bubbles:true}));
  messageText.value='92 61 da 1n';
  messageText.dispatchEvent(new w.Event('input',{bubbles:true}));
  syntaxButton.click();

  const previewDeadline=Date.now()+12000;
  while(Date.now()<previewDeadline){
    const text=String(preview.textContent||'');
    if(text.includes('Hệ thống đọc:')&&text.includes('92 61')&&text.includes('Đá thẳng'))break;
    if(preview.classList.contains('err'))fail('SYNTAX_REVIEW_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  const previewText=String(preview.textContent||'');
  if(!previewText.includes('Hệ thống đọc:')||!previewText.includes('92 61')||!previewText.includes('Đá thẳng')){
    fail('SYNTAX_REVIEW_TIMEOUT:'+previewText);
  }
  if(!preview.classList.contains('ok'))fail('SYNTAX_REVIEW_NOT_OK');

  const partnerTab=d.querySelector('.nav button[data-pane="partner"]');
  const partnerPane=d.getElementById('pane-partner');
  const partnerName=d.getElementById('partnerName');
  const partnerRole=d.getElementById('partnerRole');
  const addPartner=d.getElementById('addPartner');
  const partnerStatus=d.getElementById('partnerStatus');
  const partnerSelect=d.getElementById('partnerSelect');
  if(!partnerTab||!partnerPane||!partnerName||!partnerRole||!addPartner||!partnerStatus||!partnerSelect){
    fail('PARTNER_UI_REQUIRED');
  }

  partnerTab.click();
  if(!partnerPane.classList.contains('active'))fail('PARTNER_TAB_NOT_ACTIVE');
  partnerName.value='CI Smoke Partner';
  partnerRole.value='customer';
  addPartner.click();

  const partnerDeadline=Date.now()+12000;
  while(Date.now()<partnerDeadline){
    const text=String(partnerStatus.textContent||'');
    if(text.includes('Đã lưu CI Smoke Partner.'))break;
    if(partnerStatus.classList.contains('err'))fail('PARTNER_SAVE_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!String(partnerStatus.textContent||'').includes('Đã lưu CI Smoke Partner.')){
    fail('PARTNER_SAVE_TIMEOUT:'+String(partnerStatus.textContent||''));
  }

  const selectedText=partnerSelect.options&&partnerSelect.selectedIndex>=0
    ?String(partnerSelect.options[partnerSelect.selectedIndex].textContent||''):'';
  if(!selectedText.includes('CI Smoke Partner'))fail('PARTNER_UI_SELECTION_MISMATCH:'+selectedText);

  const store=w.KTS_SETTLEMENT_STORE;
  if(!store||typeof store.getAll!=='function'||!store.STORES||!store.STORES.partners){
    fail('SETTLEMENT_STORE_REQUIRED');
  }
  const savedPartners=await store.getAll(store.STORES.partners);
  const smokePartner=(savedPartners||[]).find(p=>p&&p.name==='CI Smoke Partner');
  if(!smokePartner)fail('PARTNER_INDEXEDDB_MISSING');
  if(smokePartner.active===false)fail('PARTNER_INDEXEDDB_INACTIVE');
  if(smokePartner.role!=='customer')fail('PARTNER_INDEXEDDB_ROLE_MISMATCH');

  const configTab=d.querySelector('.nav button[data-pane="config"]');
  const configPane=d.getElementById('pane-config');
  const effectiveDate=d.getElementById('effectiveDate');
  const allowMbXien=d.getElementById('allowMbXien');
  const allowUi=d.getElementById('allowUi');
  const saveConfig=d.getElementById('saveConfig');
  const configStatus=d.getElementById('configStatus');
  if(!configTab||!configPane||!effectiveDate||!allowMbXien||!allowUi||!saveConfig||!configStatus){
    fail('CONFIG_UI_REQUIRED');
  }

  configTab.click();
  if(!configPane.classList.contains('active'))fail('CONFIG_TAB_NOT_ACTIVE');
  effectiveDate.value='2026-10-08';
  effectiveDate.dispatchEvent(new w.Event('change',{bubbles:true}));
  await new Promise(resolve=>setTimeout(resolve,100));

  if(allowMbXien.checked)fail('MB_XIEN_GATE_DEFAULT_ON');
  if(allowUi.checked)fail('UI_GATE_DEFAULT_ON');
  if(!allowUi.disabled)fail('UI_GATE_NOT_LOCKED');
  allowUi.click();
  if(allowUi.checked)fail('UI_GATE_CLICK_UNLOCKED');

  const featureGates=w.KTS_SETTLEMENT_FEATURE_GATES;
  if(!featureGates)fail('FEATURE_GATES_REQUIRED');
  if(featureGates.UI_CONFIRMED!==false)fail('UI_GATE_AUTHORITY_NOT_LOCKED');
  if(featureGates.uiEnabled({tinh_ui:true})!==false)fail('UI_GATE_LEGACY_FLAG_UNLOCKED');
  if(featureGates.materializeUiRow({code:'UI',hit_units:4,payout:40},{tinh_ui:true})!==null){
    fail('UI_GATE_LEGACY_ROW_MATERIALIZED');
  }
  const guardedLegacy=featureGates.guardCategoryRows([
    {code:'2CB',xac:18},
    {code:'UI',hit_units:4,payout:40}
  ],{tinh_ui:true,mb_xien_234:false});
  if(!Array.isArray(guardedLegacy)||guardedLegacy.length!==1||guardedLegacy[0].code!=='2CB'){
    fail('UI_GATE_LEGACY_ROWS_NOT_FILTERED');
  }

  for(const input of d.querySelectorAll('[data-price-region]'))input.value='0';
  const setValue=(id,value)=>{
    const el=d.getElementById(id);
    if(!el)fail('CONFIG_FIELD_MISSING:'+id);
    el.value=value;
  };
  setValue('commissionType','ratio');
  setValue('mnTotalPercent','100');
  setValue('mnRefundPercent','0');
  setValue('mtTotalPercent','100');
  setValue('mtRefundPercent','0');
  setValue('mbTotalPercent','100');
  setValue('mbRefundPercent','0');

  saveConfig.click();
  const configDeadline=Date.now()+12000;
  while(Date.now()<configDeadline){
    const text=String(configStatus.textContent||'');
    if(text.includes('Đã lưu v'))break;
    if(configStatus.classList.contains('err'))fail('CONFIG_SAVE_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!String(configStatus.textContent||'').includes('Đã lưu v')){
    fail('CONFIG_SAVE_TIMEOUT:'+String(configStatus.textContent||''));
  }

  const savedConfig=await store.resolveConfigForDate(smokePartner.id,'2026-10-08');
  if(!savedConfig)fail('CONFIG_INDEXEDDB_MISSING');
  if(savedConfig.mb_xien_234!==false)fail('CONFIG_MB_XIEN_GATE_CHANGED');
  if(savedConfig.tinh_ui!==false)fail('CONFIG_UI_GATE_CHANGED');
  for(const region of ['mn','mt','mb']){
    const terms=savedConfig.region_terms&&savedConfig.region_terms[region]||{};
    if(String(terms.total_percent)!=='100')fail('CONFIG_TOTAL_PERCENT_'+region.toUpperCase());
    if(String(terms.refund_percent)!=='0')fail('CONFIG_REFUND_PERCENT_'+region.toUpperCase());
  }

  messageTab.click();
  if(!messagePane.classList.contains('active'))fail('MESSAGE_TAB_NOT_ACTIVE_FOR_SAVE');
  messageDate.value='2099-12-31';
  messageRegion.value='mb';
  messageRegion.dispatchEvent(new w.Event('change',{bubbles:true}));
  messageText.value='92 61 da 1n';
  messageText.dispatchEvent(new w.Event('input',{bubbles:true}));

  const saveMessage=d.getElementById('saveMessage');
  const messageStatus=d.getElementById('messageStatus');
  if(!saveMessage||!messageStatus)fail('MESSAGE_SAVE_UI_REQUIRED');

  saveMessage.click();
  const messageDeadline=Date.now()+15000;
  while(Date.now()<messageDeadline){
    const text=String(messageStatus.textContent||'');
    if(text.includes('Đã parse tin')&&text.includes('Chờ KQXS trước khi tính tiền'))break;
    if(messageStatus.classList.contains('err'))fail('MESSAGE_SAVE_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  const messageStatusText=String(messageStatus.textContent||'');
  if(!messageStatusText.includes('Đã parse tin')||!messageStatusText.includes('Chờ KQXS trước khi tính tiền')){
    fail('MESSAGE_WAITING_RESULT_TIMEOUT:'+messageStatusText);
  }
  if(String(messageText.value||'')!=='')fail('MESSAGE_EDITOR_NOT_CLEARED');

  const savedMessages=await store.getAll(store.STORES.messages);
  const smokeMessages=(savedMessages||[]).filter(m=>
    m&&m.partner_id===smokePartner.id&&
    m.business_date==='2099-12-31'&&
    String(m.region||'').toLowerCase()==='mb'&&
    m.raw_text==='92 61 da 1n'
  );
  if(smokeMessages.length!==1)fail('MESSAGE_PERSISTENCE_COUNT:'+smokeMessages.length);
  const smokeMessage=smokeMessages[0];
  if(smokeMessage.status!=='parsed_waiting_result')fail('MESSAGE_STATUS:'+String(smokeMessage.status||''));
  const messageLegs=smokeMessage.canonical_payload&&smokeMessage.canonical_payload.legs||[];
  if(!messageLegs.length||messageLegs[0].code!=='DAT')fail('MESSAGE_CANONICAL_DAT');
  if(smokeMessage.parser_error)fail('MESSAGE_PARSER_ERROR_PERSISTED');

  const futureResult=await store.get(store.STORES.results,'2099-12-31:mb');
  if(futureResult)fail('FUTURE_KQXS_MUST_NOT_EXIST');

  const refreshHistory=d.getElementById('refreshMessageHistory');
  const historyStatus=d.getElementById('messageHistoryStatus');
  const historyHost=d.getElementById('messageHistory');
  if(!refreshHistory||!historyStatus||!historyHost)fail('MESSAGE_HISTORY_UI_REQUIRED');

  w.confirm=()=>true;
  refreshHistory.click();

  const historyDeadline=Date.now()+10000;
  let cancelButton=null;
  while(Date.now()<historyDeadline){
    cancelButton=historyHost.querySelector('[data-cancel-message="'+smokeMessage.id+'"]');
    if(cancelButton)break;
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!cancelButton)fail('MESSAGE_CANCEL_BUTTON_MISSING');

  cancelButton.click();
  const cancelDeadline=Date.now()+12000;
  let cancelled=null;
  while(Date.now()<cancelDeadline){
    cancelled=await store.get(store.STORES.messages,smokeMessage.id);
    if(cancelled&&cancelled.status==='cancelled')break;
    if(historyStatus.classList.contains('err'))fail('MESSAGE_CANCEL_UI_ERROR:'+String(historyStatus.textContent||''));
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!cancelled||cancelled.status!=='cancelled')fail('MESSAGE_CANCEL_NOT_PERSISTED');

  const scopeId='scope:'+smokePartner.id+':2099-12-31:mb';
  const emptySettlement=await store.get(store.STORES.settlements,scopeId);
  if(!emptySettlement||emptySettlement.scope_status!=='empty')fail('MESSAGE_CANCEL_SCOPE_NOT_EMPTY');

  let restoreButton=null;
  const restoreButtonDeadline=Date.now()+10000;
  while(Date.now()<restoreButtonDeadline){
    restoreButton=historyHost.querySelector('[data-restore-message="'+smokeMessage.id+'"]');
    if(restoreButton)break;
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!restoreButton)fail('MESSAGE_RESTORE_BUTTON_MISSING');

  restoreButton.click();
  const restoreDeadline=Date.now()+12000;
  let restored=null;
  while(Date.now()<restoreDeadline){
    restored=await store.get(store.STORES.messages,smokeMessage.id);
    if(restored&&restored.status==='parsed_waiting_result')break;
    if(historyStatus.classList.contains('err'))fail('MESSAGE_RESTORE_UI_ERROR:'+String(historyStatus.textContent||''));
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!restored||restored.status!=='parsed_waiting_result')fail('MESSAGE_RESTORE_NOT_PERSISTED');

  const blockedSettlement=await store.get(store.STORES.settlements,scopeId);
  if(!blockedSettlement||blockedSettlement.scope_status!=='blocked')fail('MESSAGE_RESTORE_SCOPE_NOT_BLOCKED');
  const blockedReasons=Array.isArray(blockedSettlement.blocked_reasons)?blockedSettlement.blocked_reasons.map(String):[];
  if(!blockedReasons.some(reason=>reason.includes('KQXS_NOT_AVAILABLE')))fail('MESSAGE_RESTORE_BLOCK_REASON_MISSING');

  const restoredCancel=historyHost.querySelector('[data-cancel-message="'+smokeMessage.id+'"]');
  if(!restoredCancel)fail('MESSAGE_RESTORE_UI_NOT_REFRESHED');

  const reportTab=d.querySelector('.nav button[data-pane="report"]');
  const reportPane=d.getElementById('pane-report');
  const reportDate=d.getElementById('reportDate');
  const reportPartner=d.getElementById('reportPartner');
  const loadReport=d.getElementById('loadReport');
  const reportOutput=d.getElementById('reportOutput');
  const dailyOpsStatus=d.getElementById('dailyOpsStatus');
  const dailyCloseReadiness=d.getElementById('dailyCloseReadiness');
  if(!reportTab||!reportPane||!reportDate||!reportPartner||!loadReport||!reportOutput||!dailyOpsStatus||!dailyCloseReadiness){
    fail('REPORT_UI_REQUIRED');
  }

  reportTab.click();
  if(!reportPane.classList.contains('active'))fail('REPORT_TAB_NOT_ACTIVE');
  reportDate.value='2099-12-31';
  reportPartner.value=smokePartner.id;
  reportDate.dispatchEvent(new w.Event('change',{bubbles:true}));
  loadReport.click();

  const reportDeadline=Date.now()+12000;
  while(Date.now()<reportDeadline){
    const text=String(reportOutput.textContent||'');
    const dayText=String(dailyOpsStatus.textContent||'');
    if(text.includes('CI Smoke Partner')&&text.includes('Không dùng tổng tiền này để chốt')&&dayText.includes('CÓ PHẠM VI CHƯA TÍNH'))break;
    await new Promise(resolve=>setTimeout(resolve,100));
  }

  const reportText=String(reportOutput.textContent||'');
  const dayStatusText=String(dailyOpsStatus.textContent||'');
  const readinessText=String(dailyCloseReadiness.textContent||'');
  if(!reportText.includes('CI Smoke Partner'))fail('REPORT_PARTNER_MISSING:'+reportText);
  if(!reportText.includes('Không dùng tổng tiền này để chốt'))fail('REPORT_BLOCKED_WARNING_MISSING:'+reportText);
  if(!dayStatusText.includes('CÓ PHẠM VI CHƯA TÍNH'))fail('REPORT_DAY_BLOCKED_MISSING:'+dayStatusText);
  if(!readinessText.includes('TRẠNG THÁI CHỐT NGÀY: CHƯA ĐỦ'))fail('REPORT_CLOSE_GATE_NOT_BLOCKED:'+readinessText);

  const reportApi=w.KTS_SETTLEMENT_REPORT;
  if(!reportApi||typeof reportApi.buildDailyPartnerReport!=='function')fail('REPORT_API_REQUIRED');
  const settlementsForReport=await store.getAll(store.STORES.settlements);
  const messagesForReport=await store.getAll(store.STORES.messages);
  const messageMap=Object.fromEntries(messagesForReport.map(m=>[m.id,m]));
  const reportModel=reportApi.buildDailyPartnerReport({
    partner:smokePartner,
    business_date:'2099-12-31',
    settlements:settlementsForReport,
    messages_by_id:messageMap
  });
  if(reportModel.blocked!==true)fail('REPORT_MODEL_NOT_BLOCKED');
  if(!Array.isArray(reportModel.blocked_scopes)||reportModel.blocked_scopes.length!==1)fail('REPORT_BLOCKED_SCOPE_COUNT');
  const totals=reportModel.totals||{};
  for(const field of ['xac','qua_co','payout','refund_amount','final_net']){
    if(Number(totals[field]||0)!==0)fail('REPORT_NONZERO_'+field.toUpperCase());
  }

  const backup=await store.exportAll();
  if(!backup||backup.format!=='kts-settlement-export'||backup.version!==5)fail('BACKUP_FORMAT_INVALID');
  const backupStores=backup.stores||{};
  const backupPartners=backupStores[store.STORES.partners]||[];
  const backupConfigs=backupStores[store.STORES.configs]||[];
  const backupMessages=backupStores[store.STORES.messages]||[];
  if(!backupPartners.some(p=>p&&p.id===smokePartner.id&&p.name==='CI Smoke Partner'))fail('BACKUP_PARTNER_MISSING');
  if(!backupConfigs.some(c=>c&&c.partner_id===smokePartner.id&&c.effective_from_date==='2026-10-08'))fail('BACKUP_CONFIG_MISSING');
  if(!backupMessages.some(m=>m&&m.id===smokeMessage.id&&m.raw_text==='92 61 da 1n'))fail('BACKUP_MESSAGE_MISSING');

  const beforeCounts={};
  for(const name of Object.values(store.STORES))beforeCounts[name]=(await store.getAll(name)).length;
  const imported=await store.importAll(backup,{replace:false});
  if(!imported||imported.valid!==true||imported.replace!==false)fail('BACKUP_MERGE_VALIDATION');
  for(const name of Object.values(store.STORES)){
    if(Number(imported.inserted_counts&&imported.inserted_counts[name]||0)!==0){
      fail('BACKUP_MERGE_INSERTED_EXISTING:'+name);
    }
    const after=(await store.getAll(name)).length;
    if(after!==beforeCounts[name])fail('BACKUP_MERGE_COUNT_CHANGED:'+name+':'+beforeCounts[name]+'->'+after);
  }

  const fixturePrice=()=>({commission:'0.76',win:'1'});
  const fixtureConfig=await store.saveConfig({
    partner_id:smokePartner.id,
    effective_from_date:'2026-01-01',
    commission_type:'ratio',
    total_percent:'100',
    refund_percent:'0',
    mb_xien_234:false,
    tinh_ui:false,
    region_terms:{
      mn:{total_percent:'100',refund_percent:'0',dat_hit_mode:'ky_ruoi',dax_hit_mode:'multi_pair'},
      mt:{total_percent:'100',refund_percent:'0',dat_hit_mode:'ky_ruoi',dax_hit_mode:'multi_pair'},
      mb:{total_percent:'50',refund_percent:'0'}
    },
    region_pricing:{mb:{
      '2CB':fixturePrice(),'2CD':fixturePrice(),'2CB8':fixturePrice(),DAT:fixturePrice(),
      '3CB':fixturePrice(),'3CB7':fixturePrice(),'3CDD':fixturePrice(),'4C':fixturePrice(),
      MB_XIEN2:{commission:'56',win:'1000'},UI:{commission:'0',win:'10'}
    }}
  });
  if(!fixtureConfig||fixtureConfig.effective_from_date!=='2026-01-01')fail('FIXTURE_CONFIG_SAVE_FAILED');
  if(fixtureConfig.tinh_ui!==false)fail('FIXTURE_UI_GATE_CHANGED');

  const pipeline=w.KTS_SETTLEMENT_PIPELINE;
  const parserProvider=w.KTS_SETTLEMENT_PARSER_PROVIDER;
  if(!pipeline||!parserProvider)fail('FIXTURE_PIPELINE_REQUIRED');

  const fixtureMessage1=await pipeline.parseAndSaveMessage({
    partner_id:smokePartner.id,
    business_date:'2026-09-22',
    region:'mb',
    raw_text:'92 b 1n',
    parser_provider:parserProvider
  });
  const fixtureMessage2=await pipeline.parseAndSaveMessage({
    partner_id:smokePartner.id,
    business_date:'2026-09-22',
    region:'mb',
    raw_text:'92 61 da 1n',
    parser_provider:parserProvider
  });
  if(fixtureMessage1.status!=='parsed_waiting_result'||fixtureMessage2.status!=='parsed_waiting_result'){
    fail('FIXTURE_MESSAGES_NOT_WAITING_RESULT');
  }
  const fixtureLeg1=fixtureMessage1.message&&fixtureMessage1.message.canonical_payload&&fixtureMessage1.message.canonical_payload.legs||[];
  const fixtureLeg2=fixtureMessage2.message&&fixtureMessage2.message.canonical_payload&&fixtureMessage2.message.canonical_payload.legs||[];
  if(!fixtureLeg1.length||fixtureLeg1[0].code!=='2CB')fail('FIXTURE_2CB_CANONICAL');
  if(!fixtureLeg2.length||fixtureLeg2[0].code!=='DAT')fail('FIXTURE_DAT_CANONICAL');

  const fixtureResult={
    business_date:'2026-09-22',
    region:'mb',
    status:'complete',
    complete:true,
    expected_station_codes:['mb'],
    verification_status:'verified',
    verified:true,
    verification_sources:['primary','secondary'],
    stations:[{code:'mb',name:'Miền Bắc',prizes:{
      DB:['31922'],
      G1:['12361'],
      G2:['10001','20002'],
      G3:['30003','40004','50005','60006','70007','80008'],
      G4:['90009','11110','22211','33312'],
      G5:['44592','55514','66615','77716','88817','99918'],
      G6:['192','319','561'],
      G7:['92','20','30','40']
    }}]
  };
  const savedFixtureResult=await store.saveResultSnapshot(fixtureResult);
  if(!savedFixtureResult||!savedFixtureResult.snapshot)fail('FIXTURE_RESULT_SAVE_FAILED');
  if(savedFixtureResult.snapshot.complete!==true)fail('FIXTURE_RESULT_NOT_COMPLETE');
  if(savedFixtureResult.snapshot.verified!==true||savedFixtureResult.snapshot.verification_status!=='verified'){
    fail('FIXTURE_RESULT_NOT_VERIFIED');
  }

  }

  const driftMaterial=JSON.parse(JSON.stringify(historyMaterial));
  driftMaterial.results[0].fingerprint='acceptance-history-result-drift';
  const driftComponents=await qualificationHistory.componentFingerprints(driftMaterial);
  const driftFingerprint=await qualificationHistory.overallFingerprint(historyOptions,driftComponents);
  if(driftFingerprint===readyFingerprint)fail('QUALIFICATION_HISTORY_DRIFT_FINGERPRINT_UNCHANGED');

  const staleVerdict=qualificationHistory.classifyReadyValidity(
    readyEvent,driftComponents,driftFingerprint,{status:'available',identity:liveBackendIdentity}
  );
  if(staleVerdict.status!=='READY_EVIDENCE_STALE'||staleVerdict.current!==false){
    fail('QUALIFICATION_HISTORY_STALE_VERDICT');
  }
  if(!Array.isArray(staleVerdict.changed_components)||!staleVerdict.changed_components.includes('results')){
    fail('QUALIFICATION_HISTORY_RESULTS_DRIFT_NOT_REPORTED');
  }

  const blockedQualification={
    qualification_state:'BLOCKED_SHADOW_QUALIFICATION',
    ready_for_production_review:false,
    blockers:['KQXS_SETTLEMENT_RESULT_DRIFT']
  };
  const blockedHistoryEvent=qualificationHistory.buildEvidenceEvent(
    blockedQualification,historyOptions,driftComponents,driftFingerprint,[readyEvent]
  );
  if(blockedHistoryEvent.invalidates_previous_ready!==true)fail('QUALIFICATION_HISTORY_READY_NOT_INVALIDATED');
  if(blockedHistoryEvent.requalifies_after_change!==false)fail('QUALIFICATION_HISTORY_FALSE_REQUALIFY');
  if(!Array.isArray(blockedHistoryEvent.changed_components_from_last_ready)||
     !blockedHistoryEvent.changed_components_from_last_ready.includes('results')){
    fail('QUALIFICATION_HISTORY_INVALIDATION_COMPONENT');
  }
  if(blockedHistoryEvent.production_enabled!==false||blockedHistoryEvent.merge_authorized!==false){
    fail('QUALIFICATION_HISTORY_BLOCKED_AUTHORITY_ESCALATION');
  }

  const requalifiedEvent=qualificationHistory.buildEvidenceEvent(
    readyQualification,historyOptions,driftComponents,driftFingerprint,[readyEvent,blockedHistoryEvent]
  );
  if(requalifiedEvent.requalifies_after_change!==true)fail('QUALIFICATION_HISTORY_REQUALIFY_MISSING');
  if(requalifiedEvent.invalidates_previous_ready!==false)fail('QUALIFICATION_HISTORY_REQUALIFY_INVALIDATION');
  if(requalifiedEvent.previous_ready_event_id!==readyEvent.id)fail('QUALIFICATION_HISTORY_PREVIOUS_READY_LINK');
  if(requalifiedEvent.production_enabled!==false||requalifiedEvent.merge_authorized!==false){
    fail('QUALIFICATION_HISTORY_REQUALIFY_AUTHORITY_ESCALATION');
  }
  const requalifiedVerdict=qualificationHistory.classifyReadyValidity(
    requalifiedEvent,driftComponents,driftFingerprint,{status:'available',identity:liveBackendIdentity}
  );
  if(requalifiedVerdict.status!=='READY_EVIDENCE_CURRENT'||requalifiedVerdict.current!==true){
    fail('QUALIFICATION_HISTORY_REQUALIFIED_CURRENT_VERDICT');
  }

  const liveQualification=await qualificationApi.runQualification({
    from_date:'2026-09-22',
    to_date:'2026-09-22',
    required_observation_days:1,
    partner_id:smokePartner.id,
    regions:['mb'],
    check_parser:true
  });
  if(!liveQualification||liveQualification.ready_for_production_review!==true){
    fail('QUALIFICATION_LIVE_NOT_READY:'+JSON.stringify(liveQualification&&liveQualification.blockers||[]));
  }
  if(liveQualification.qualification_state!=='READY_FOR_PRODUCTION_REVIEW'){
    fail('QUALIFICATION_LIVE_STATE:'+String(liveQualification.qualification_state||''));
  }
  if(liveQualification.production_enabled!==false||liveQualification.merge_authorized!==false){
    fail('QUALIFICATION_LIVE_AUTHORITY_ESCALATION');
  }

  const persistedReady=await qualificationHistory.recordQualification(liveQualification,{
    from_date:'2026-09-22',
    to_date:'2026-09-22',
    required_observation_days:1,
    partner_id:smokePartner.id,
    regions:['mb']
  });
  if(!persistedReady||persistedReady.ready_for_production_review!==true){
    fail('QUALIFICATION_HISTORY_RECORD_NOT_READY');
  }
  if(!/^[0-9a-f]{64}$/.test(String(persistedReady.input_fingerprint_sha256||''))){
    fail('QUALIFICATION_HISTORY_RECORD_FINGERPRINT');
  }
  if(persistedReady.production_enabled!==false||persistedReady.merge_authorized!==false){
    fail('QUALIFICATION_HISTORY_RECORD_AUTHORITY_ESCALATION');
  }

  const persistedEvents=await qualificationHistory.listEvents();
  if(!Array.isArray(persistedEvents)||persistedEvents.length!==1){
    fail('QUALIFICATION_HISTORY_APPEND_COUNT:'+String(persistedEvents&&persistedEvents.length));
  }
  if(persistedEvents[0].id!==persistedReady.id)fail('QUALIFICATION_HISTORY_PERSISTED_EVENT_ID');

  const persistedValidity=await qualificationHistory.checkLastReadyValidity();
  if(!persistedValidity||persistedValidity.status!=='READY_EVIDENCE_CURRENT'||persistedValidity.current!==true){
    fail('QUALIFICATION_HISTORY_PERSISTED_NOT_CURRENT:'+String(persistedValidity&&persistedValidity.status||''));
  }
  if(!persistedValidity.ready_event||persistedValidity.ready_event.id!==persistedReady.id){
    fail('QUALIFICATION_HISTORY_READY_EVENT_LINK');
  }
  if(!persistedValidity.current_parser_backend||persistedValidity.current_parser_backend.status!=='available'){
    fail('QUALIFICATION_HISTORY_CURRENT_BACKEND_UNAVAILABLE');
  }

  out.textContent=[
    'ACCEPTANCE_SMOKE=PASS',
    'IFRAME_RUNTIME=PASS',
    'RUNTIME_ENDPOINTS=PASS',
    'BROWSER_CORS_HEALTH=PASS',
    'BROWSER_CORS_IDENTITY=PASS',
    'BROWSER_CORS_PARSER=PASS code=DAT',
    'UI_MESSAGE_TAB=PASS',
    'UI_SYNTAX_REVIEW=PASS DAT',
    'UI_PARTNER_CREATE=PASS',
    'INDEXEDDB_PARTNER_PERSISTENCE=PASS',
    'UI_CONFIG_SAVE=PASS',
    'INDEXEDDB_CONFIG_PERSISTENCE=PASS',
    'CONFIG_UNCONFIRMED_GATES_OFF=PASS',
    'UI_GATE_BROWSER_LOCKED=PASS',
    'UI_GATE_LEGACY_TRUE_FAIL_CLOSED=PASS',
    'UI_MESSAGE_SAVE=PASS',
    'INDEXEDDB_MESSAGE_PERSISTENCE=PASS',
    'MESSAGE_WAITING_RESULT_FAIL_CLOSED=PASS',
    'BACKUP_EXPORT_BROWSER=PASS',
    'BACKUP_MERGE_IDEMPOTENT=PASS',
    'UI_MESSAGE_CANCEL=PASS',
    'UI_MESSAGE_RESTORE=PASS',
    'MESSAGE_SCOPE_LIFECYCLE=PASS',
    'UI_REPORT_BLOCKED=PASS',
    'REPORT_ZERO_MONEY=PASS',
    'DAILY_CLOSE_NOT_READY=PASS',
    'KQXS_VERIFIED_FIXTURE=PASS',
    'SETTLEMENT_CANONICAL_TOTALS=PASS',
    'REPORT_CANONICAL_TOTALS=PASS',
    'SHADOW_UNVERIFIED_FAIL_CLOSED=PASS',
    'DAILY_CLOSE_REQUIRES_MATCH_EXACT=PASS',
    'KQXS_CONFLICT_AUTHORITY=PASS',
    'KQXS_CONFLICT_SETTLEMENT_BLOCKED=PASS',
    'KQXS_CONFLICT_ZERO_MONEY=PASS',
    'KQXS_CONFLICT_RECOVERY=PASS',
    'KQXS_RECOVERY_AUDIT=PASS',
    'KQXS_RECOVERY_CANONICAL_TOTALS=PASS',
    'SHADOW_MATCH_EXACT=PASS',
    'SHADOW_EVIDENCE_PERSISTED=PASS',
    'DAILY_CLOSE_READY_AFTER_EXACT=PASS',
    'OBSERVATION_PROMOTION_READY=PASS',
    'OBSERVATION_STRICT_KQXS_GATE=PASS',
    'OBSERVATION_DURATION_FAIL_CLOSED=PASS',
    'OBSERVATION_REGRESSION_FAIL_CLOSED=PASS',
    'OBSERVATION_CANDIDATE_PENDING_FAIL_CLOSED=PASS',
    'QUALIFICATION_KQXS_CURRENT=PASS',
    'QUALIFICATION_RESULT_DRIFT_BLOCKED=PASS',
    'BUILD_IDENTITY_RUNTIME_VALID=PASS',
    'QUALIFICATION_HISTORY_READY_CURRENT=PASS',
    'QUALIFICATION_HISTORY_RESULT_DRIFT_STALE=PASS',
    'QUALIFICATION_HISTORY_REQUALIFY=PASS',
    'QUALIFICATION_HISTORY_NO_AUTHORITY_ESCALATION=PASS',
    'QUALIFICATION_LIVE_READY=PASS',
    'QUALIFICATION_HISTORY_INDEXEDDB_APPEND=PASS',
    'QUALIFICATION_HISTORY_PERSISTED_CURRENT=PASS'
  ].join('\n');
})().catch(error=>{
  document.getElementById('result').textContent='ACCEPTANCE_SMOKE=FAIL '+String(error&&error.message||error);
});
</script>

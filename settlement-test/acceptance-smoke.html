<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>KTS Settlement Acceptance Smoke</title>
<style>body{font-family:system-ui,sans-serif;margin:12px}#app{width:100%;height:720px;border:1px solid #ccc}#result{white-space:pre-wrap;font:13px/1.45 ui-monospace,monospace}</style>
</head>
<body>
<pre id="result">ACCEPTANCE_SMOKE=PENDING</pre>
<iframe id="app" src="./settlement.html?acceptance-smoke=1"></iframe>
<script>
(async()=>{
  const out=document.getElementById('result');
  const frame=document.getElementById('app');
  const fail=(m)=>{throw new Error(m);};
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('IFRAME_LOAD_TIMEOUT')),15000);
    frame.addEventListener('load',()=>{clearTimeout(timer);resolve();},{once:true});
  });

  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!w||!d)fail('IFRAME_ACCESS_FAILED');
  if(d.body && d.body.textContent.includes('Khởi tạo lỗi:'))fail('SETTLEMENT_BOOT_ERROR');

  const cfg=w.KTS_SETTLEMENT_RUNTIME_ENDPOINTS||{};
  const api='https://kts-settlement-api-test.onrender.com';
  const expectedParser=api+'/api/settlement/parse';
  const expectedKqxs=api+'/api/kqxs';
  if(cfg.parser_endpoint!==expectedParser)fail('PARSER_ENDPOINT_CONFIG_MISMATCH:'+String(cfg.parser_endpoint||''));
  if(cfg.kqxs_endpoint!==expectedKqxs)fail('KQXS_ENDPOINT_CONFIG_MISMATCH:'+String(cfg.kqxs_endpoint||''));

  const parserInput=d.getElementById('parserEndpoint');
  const resultInput=d.getElementById('resultEndpoint');
  if(!parserInput||parserInput.value!==expectedParser)fail('PARSER_ENDPOINT_UI_MISMATCH');
  if(!resultInput||resultInput.value!==expectedKqxs)fail('KQXS_ENDPOINT_UI_MISMATCH');
  for(const id of ['kqxsAutoBadge','checkMessageSyntax','messageParsePreview']){
    if(!d.getElementById(id))fail('MISSING_DYNAMIC_DOM:'+id);
  }

  const health=await fetch(api+'/health',{cache:'no-store'});
  if(!health.ok)fail('HEALTH_HTTP_'+health.status);
  const healthJson=await health.json();
  if(healthJson.ok!==true||healthJson.service!=='kts-settlement-api')fail('HEALTH_CONTRACT');

  const identity=await fetch(api+'/api/settlement/parser-identity',{cache:'no-store'});
  if(!identity.ok)fail('IDENTITY_HTTP_'+identity.status);
  const identityJson=await identity.json();
  if(identityJson.ok!==true||identityJson.identity_contract!=='kts-parser-identity-v1')fail('IDENTITY_CONTRACT');

  const parsed=await fetch(expectedParser,{
    method:'POST',
    cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({region:'mb',raw_text:'92 61 da 1n'})
  });
  if(!parsed.ok)fail('PARSER_HTTP_'+parsed.status);
  const parsedJson=await parsed.json();
  const legs=parsedJson&&parsedJson.canonical_payload&&parsedJson.canonical_payload.legs||[];
  if(!legs.length||legs[0].code!=='DAT')fail('PARSER_CANONICAL_DAT');

  const messageTab=d.querySelector('.nav button[data-pane="message"]');
  const messagePane=d.getElementById('pane-message');
  const messageDate=d.getElementById('messageDate');
  const messageRegion=d.getElementById('messageRegion');
  const messageText=d.getElementById('messageText');
  const syntaxButton=d.getElementById('checkMessageSyntax');
  const preview=d.getElementById('messageParsePreview');
  if(!messageTab||!messagePane||!messageDate||!messageRegion||!messageText||!syntaxButton||!preview){
    fail('MESSAGE_UI_REQUIRED');
  }

  messageTab.click();
  if(!messagePane.classList.contains('active'))fail('MESSAGE_TAB_NOT_ACTIVE');
  messageDate.value='2026-10-08';
  messageRegion.value='mb';
  messageRegion.dispatchEvent(new w.Event('change',{bubbles:true}));
  messageText.value='92 61 da 1n';
  messageText.dispatchEvent(new w.Event('input',{bubbles:true}));
  syntaxButton.click();

  const previewDeadline=Date.now()+12000;
  while(Date.now()<previewDeadline){
    const text=String(preview.textContent||'');
    if(text.includes('Hệ thống đọc:')&&text.includes('92 61')&&text.includes('Đá thẳng'))break;
    if(preview.classList.contains('err'))fail('SYNTAX_REVIEW_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  const previewText=String(preview.textContent||'');
  if(!previewText.includes('Hệ thống đọc:')||!previewText.includes('92 61')||!previewText.includes('Đá thẳng')){
    fail('SYNTAX_REVIEW_TIMEOUT:'+previewText);
  }
  if(!preview.classList.contains('ok'))fail('SYNTAX_REVIEW_NOT_OK');

  const partnerTab=d.querySelector('.nav button[data-pane="partner"]');
  const partnerPane=d.getElementById('pane-partner');
  const partnerName=d.getElementById('partnerName');
  const partnerRole=d.getElementById('partnerRole');
  const addPartner=d.getElementById('addPartner');
  const partnerStatus=d.getElementById('partnerStatus');
  const partnerSelect=d.getElementById('partnerSelect');
  if(!partnerTab||!partnerPane||!partnerName||!partnerRole||!addPartner||!partnerStatus||!partnerSelect){
    fail('PARTNER_UI_REQUIRED');
  }

  partnerTab.click();
  if(!partnerPane.classList.contains('active'))fail('PARTNER_TAB_NOT_ACTIVE');
  partnerName.value='CI Smoke Partner';
  partnerRole.value='customer';
  addPartner.click();

  const partnerDeadline=Date.now()+12000;
  while(Date.now()<partnerDeadline){
    const text=String(partnerStatus.textContent||'');
    if(text.includes('Đã lưu CI Smoke Partner.'))break;
    if(partnerStatus.classList.contains('err'))fail('PARTNER_SAVE_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!String(partnerStatus.textContent||'').includes('Đã lưu CI Smoke Partner.')){
    fail('PARTNER_SAVE_TIMEOUT:'+String(partnerStatus.textContent||''));
  }

  const selectedText=partnerSelect.options&&partnerSelect.selectedIndex>=0
    ?String(partnerSelect.options[partnerSelect.selectedIndex].textContent||''):'';
  if(!selectedText.includes('CI Smoke Partner'))fail('PARTNER_UI_SELECTION_MISMATCH:'+selectedText);

  const store=w.KTS_SETTLEMENT_STORE;
  if(!store||typeof store.getAll!=='function'||!store.STORES||!store.STORES.partners){
    fail('SETTLEMENT_STORE_REQUIRED');
  }
  const savedPartners=await store.getAll(store.STORES.partners);
  const smokePartner=(savedPartners||[]).find(p=>p&&p.name==='CI Smoke Partner');
  if(!smokePartner)fail('PARTNER_INDEXEDDB_MISSING');
  if(smokePartner.active===false)fail('PARTNER_INDEXEDDB_INACTIVE');
  if(smokePartner.role!=='customer')fail('PARTNER_INDEXEDDB_ROLE_MISMATCH');

  const configTab=d.querySelector('.nav button[data-pane="config"]');
  const configPane=d.getElementById('pane-config');
  const effectiveDate=d.getElementById('effectiveDate');
  const allowMbXien=d.getElementById('allowMbXien');
  const allowUi=d.getElementById('allowUi');
  const saveConfig=d.getElementById('saveConfig');
  const configStatus=d.getElementById('configStatus');
  if(!configTab||!configPane||!effectiveDate||!allowMbXien||!allowUi||!saveConfig||!configStatus){
    fail('CONFIG_UI_REQUIRED');
  }

  configTab.click();
  if(!configPane.classList.contains('active'))fail('CONFIG_TAB_NOT_ACTIVE');
  effectiveDate.value='2026-10-08';
  effectiveDate.dispatchEvent(new w.Event('change',{bubbles:true}));
  await new Promise(resolve=>setTimeout(resolve,100));

  if(allowMbXien.checked)fail('MB_XIEN_GATE_DEFAULT_ON');
  if(allowUi.checked)fail('UI_GATE_DEFAULT_ON');

  for(const input of d.querySelectorAll('[data-price-region]'))input.value='0';
  const setValue=(id,value)=>{
    const el=d.getElementById(id);
    if(!el)fail('CONFIG_FIELD_MISSING:'+id);
    el.value=value;
  };
  setValue('commissionType','ratio');
  setValue('mnTotalPercent','100');
  setValue('mnRefundPercent','0');
  setValue('mtTotalPercent','100');
  setValue('mtRefundPercent','0');
  setValue('mbTotalPercent','100');
  setValue('mbRefundPercent','0');

  saveConfig.click();
  const configDeadline=Date.now()+12000;
  while(Date.now()<configDeadline){
    const text=String(configStatus.textContent||'');
    if(text.includes('Đã lưu v'))break;
    if(configStatus.classList.contains('err'))fail('CONFIG_SAVE_ERROR:'+text);
    await new Promise(resolve=>setTimeout(resolve,100));
  }
  if(!String(configStatus.textContent||'').includes('Đã lưu v')){
    fail('CONFIG_SAVE_TIMEOUT:'+String(configStatus.textContent||''));
  }

  const savedConfig=await store.resolveConfigForDate(smokePartner.id,'2026-10-08');
  if(!savedConfig)fail('CONFIG_INDEXEDDB_MISSING');
  if(savedConfig.mb_xien_234!==false)fail('CONFIG_MB_XIEN_GATE_CHANGED');
  if(savedConfig.tinh_ui!==false)fail('CONFIG_UI_GATE_CHANGED');
  for(const region of ['mn','mt','mb']){
    const terms=savedConfig.region_terms&&savedConfig.region_terms[region]||{};
    if(String(terms.total_percent)!=='100')fail('CONFIG_TOTAL_PERCENT_'+region.toUpperCase());
    if(String(terms.refund_percent)!=='0')fail('CONFIG_REFUND_PERCENT_'+region.toUpperCase());
  }

  out.textContent=[
    'ACCEPTANCE_SMOKE=PASS',
    'IFRAME_RUNTIME=PASS',
    'RUNTIME_ENDPOINTS=PASS',
    'BROWSER_CORS_HEALTH=PASS',
    'BROWSER_CORS_IDENTITY=PASS',
    'BROWSER_CORS_PARSER=PASS code=DAT',
    'UI_MESSAGE_TAB=PASS',
    'UI_SYNTAX_REVIEW=PASS DAT',
    'UI_PARTNER_CREATE=PASS',
    'INDEXEDDB_PARTNER_PERSISTENCE=PASS',
    'UI_CONFIG_SAVE=PASS',
    'INDEXEDDB_CONFIG_PERSISTENCE=PASS',
    'CONFIG_UNCONFIRMED_GATES_OFF=PASS'
  ].join('\n');
})().catch(error=>{
  document.getElementById('result').textContent='ACCEPTANCE_SMOKE=FAIL '+String(error&&error.message||error);
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settlement qualification multi-tab IndexedDB smoke</title></head>
<body>
<pre id="result">QUALIFICATION_INDEXEDDB_BROWSER=PENDING</pre>
<script src="./settlement-store.js"></script>
<script src="./settlement-build-identity.js"></script>
<script>
(function(global){
  const hash='a'.repeat(64);
  const identity={
    api_version:'offline-synthetic-test',identity_contract:'kts-parser-identity-v1',
    identities:{
      mb:{parser_version:'synthetic',identity_sha256:hash},
      mn_mt:{parser_version:'synthetic',identity_sha256:hash}
    }
  };
  global.KTS_SETTLEMENT_QUALIFICATION={
    version:'synthetic-qualification-dependency',messageInWindow:()=>false
  };
  global.KTS_SETTLEMENT_REGRESSION_CASES={
    version:'synthetic-regression-dependency',listPinnedCases:async()=>[]
  };
  global.KTS_SETTLEMENT_REGRESSION_CANDIDATES={
    listCandidates:async()=>[]
  };
  global.KTS_SETTLEMENT_PARSER_PROVIDER={
    version:'synthetic-parser-provider',fetchIdentity:async()=>identity
  };
  global.KTS_QUALIFICATION_BROWSER_TEST_IDENTITY=identity;
})(window);
</script>
<script src="./settlement-qualification-history.js"></script>
<script>
(async()=>{
  const query=new URLSearchParams(location.search);
  if(query.has('worker'))return;
  const out=document.getElementById('result');
  const fail=message=>{throw new Error(message);};
  const store=window.KTS_SETTLEMENT_STORE;
  const history=window.KTS_SETTLEMENT_QUALIFICATION_HISTORY;
  const workerFrames=[];
  try{
    if(!window.isSecureContext)fail('BROWSER_NOT_SECURE_CONTEXT');
    if(!store||!history||!window.crypto||!crypto.subtle)fail('BROWSER_APIS_MISSING');
    // A fresh, disposable Chromium profile is required by the CI workflow.
    const meta=await store.get(store.STORES.metadata,'qualification_history_v1');
    if(meta&&Array.isArray(meta.events)&&meta.events.length)fail('PROFILE_NOT_ISOLATED');
    for(let i=0;i<2;i++){
      const frame=document.createElement('iframe');
      frame.style.display='none';
      const loaded=new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('WORKER_IFRAME_TIMEOUT_'+i)),12000);
        frame.addEventListener('load',()=>{clearTimeout(timer);resolve();},{once:true});
      });
      frame.src='./qualification-indexeddb-smoke.html?worker=1&slot='+i;
      document.body.appendChild(frame);
      workerFrames.push({frame,loaded});
    }
    await Promise.all(workerFrames.map(x=>x.loaded));
    const workers=workerFrames.map(x=>x.frame.contentWindow);
    if(workers.some(w=>!w||!w.KTS_SETTLEMENT_QUALIFICATION_HISTORY)){
      fail('WORKER_HISTORY_API_MISSING');
    }
    // Two real browsing contexts must serialize shadow receipt dedupe.
    const shadowInput={
      scope_id:'scope:shadow-atomic-test:2026-09-22:mn',
      partner_id:'shadow-atomic-test',business_date:'2026-09-22',region:'mn',
      trigger:'SYNTHETIC_CONCURRENT_AUDIT',
      local_snapshot:{total_xac:0},reference_snapshot:{total_xac:0},
      comparison:{status:'MATCH_EXACT'},comparison_status:'MATCH_EXACT'
    };
    const shadowOutcomes=await Promise.all(workers.map(w=>
      w.KTS_SETTLEMENT_STORE.saveShadowEvent(shadowInput)));
    if(shadowOutcomes.filter(r=>r.changed===true).length!==1||
       shadowOutcomes.filter(r=>r.changed===false).length!==1||
       shadowOutcomes[0].event.id!==shadowOutcomes[1].event.id)
      fail('CROSS_TAB_SHADOW_DEDUPE_FAILED');
    let shadowPersisted=await store.listShadowEvents({scope_id:shadowInput.scope_id});
    if(shadowPersisted.length!==1||
       shadowPersisted[0].id!==shadowOutcomes[0].event.id)
      fail('CROSS_TAB_SHADOW_RECEIPT_NOT_DURABLE');
    const shadowDifferent={...shadowInput,comparison:{status:'NOT_COMPARABLE'},
      comparison_status:'NOT_COMPARABLE'};
    const appended=await workers[1].KTS_SETTLEMENT_STORE.saveShadowEvent(shadowDifferent);
    if(appended.changed!==true||appended.previous.id!==shadowOutcomes[0].event.id)
      fail('SHADOW_DIFFERENT_EVIDENCE_NOT_APPENDED');
    let duplicateIdRejected=false;
    try {
      await workers[0].KTS_SETTLEMENT_STORE.saveShadowEvent({
        ...shadowInput,id:shadowOutcomes[0].event.id,comparison:{status:'MISMATCH'},
        comparison_status:'MISMATCH'
      });
    } catch (_) {duplicateIdRejected=true;}
    shadowPersisted=await store.listShadowEvents({scope_id:shadowInput.scope_id});
    if(!duplicateIdRejected||shadowPersisted.length!==2||
       shadowPersisted[0].id!==shadowOutcomes[0].event.id||
       shadowPersisted[1].id!==appended.event.id)
      fail('SHADOW_RECEIPT_ID_OVERWRITE_NOT_REJECTED');
    const options={from_date:'2026-09-22',to_date:'2026-09-22',required_observation_days:1};
    const blocked={qualification_state:'BLOCKED_SHADOW_QUALIFICATION',
      ready_for_production_review:false,blockers:['ACCEPTANCE_SYNTHETIC_BLOCKED'],
      production_enabled:false,merge_authorized:false};
    // Two real browsing contexts use separate IndexedDB connections.
    const first=await Promise.all(workers.map(w=>w.KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(blocked,options)));
    if(first.length!==2||first[0].id===first[1].id)fail('CONCURRENT_EVENT_IDS_COLLIDED');
    const persisted=await history.listEvents();
    if(persisted.length!==2)fail('CONCURRENT_INDEXEDDB_LOST_EVENT:'+persisted.length);
    if(persisted[1].previous_event_id!==persisted[0].id){
      fail('CONCURRENT_INDEXEDDB_EVENT_CHAIN_BROKEN');
    }
    if(!first.every(e=>persisted.some(p=>p.id===e.id))){
      fail('CONCURRENT_INDEXEDDB_EVENT_NOT_DURABLE');
    }
    const identity=window.KTS_QUALIFICATION_BROWSER_TEST_IDENTITY;
    const ready={
      qualification_state:'READY_FOR_PRODUCTION_REVIEW',
      ready_for_production_review:true,production_enabled:false,merge_authorized:false,
      parser_backend:{met:true,live_identity:identity},blockers:[]
    };
    for(const [invalid,reason] of [
      [{...ready,qualification_state:'BLOCKED_SHADOW_QUALIFICATION'},'READY_STATE_CONTRADICTION'],
      [{...ready,blockers:['UNEXPLAINED_MONETARY_MISMATCH']},'READY_HAS_BLOCKERS'],
      [{...ready,merge_authorized:true},'SNAPSHOT_AUTHORITY_ESCALATION'],
      [{...ready,regression_gate:{met:false}},'READY_GATE_NOT_MET_REGRESSION_GATE'],
      [{...ready,kqxs_verification:{met:false}},'READY_GATE_NOT_MET_KQXS_VERIFICATION'],
      [{...ready,ready_for_production_review:false},'BLOCKED_STATE_CONTRADICTION']
    ]){
      let rejected=false;
      try{
        await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY.recordQualification(invalid,options);
      } catch(error) {
        rejected=String(error&&error.message||error).includes('QUALIFICATION_DECISION_INVALID_'+reason);
      }
      if(!rejected)fail('CONTRADICTORY_READY_NOT_REFUSED:'+reason);
      const untouched=await history.listEvents();
      if(untouched.length!==2)fail('CONTRADICTORY_READY_APPENDED:'+reason);
    }
    const readySaved=await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(ready,options);
    const current=await history.checkLastReadyValidity();
    if(current.status!=='READY_EVIDENCE_CURRENT'||current.current!==true){
      fail('READY_CURRENT_AFTER_QUALIFICATION:'+current.status);
    }
    const blockedSaved=await workers[1].KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(blocked,options);
    const revoked=await history.checkLastReadyValidity();
    if(revoked.status!=='READY_EVIDENCE_STALE'||revoked.current!==false||
       revoked.invalidated_by_event_id!==blockedSaved.id){
      fail('BLOCKED_DID_NOT_REVOKE_READY:'+revoked.status);
    }
    const requalified=await workers[1].KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(ready,options);
    const refreshed=await history.checkLastReadyValidity();
    if(refreshed.status!=='READY_EVIDENCE_CURRENT'||refreshed.current!==true||
       refreshed.ready_event.id!==requalified.id){
      fail('REQUALIFIED_READY_NOT_CURRENT:'+refreshed.status);
    }
    const events=await history.listEvents();
    if(events.length!==5||events[2].id!==readySaved.id||events[4].id!==requalified.id){
      fail('INDEXEDDB_APPEND_SEQUENCE_UNEXPECTED:'+events.length);
    }
    if(events.some(e=>e.production_enabled!==false||e.merge_authorized!==false)){
      fail('QUALIFICATION_AUTHORITY_ESCALATION');
    }
    // Synthetic damaged history in the disposable browser profile: the
    // most recent READY must never be considered current after chain tamper.
    const row=await store.get(store.STORES.metadata,'qualification_history_v1');
    if(!row||!Array.isArray(row.events)||row.events.length!==5){
      fail('CORRUPT_JOURNAL_FIXTURE_MISSING');
    }
    row.events[4].previous_event_id='disconnected_parent';
    const db=await store.openDb();
    try {
      const tx=db.transaction(store.STORES.metadata,'readwrite');
      tx.objectStore(store.STORES.metadata).put(row);
      await new Promise((resolve,reject)=>{
        tx.oncomplete=resolve;
        tx.onerror=()=>reject(tx.error||new Error('CORRUPT_JOURNAL_TX_FAILED'));
        tx.onabort=()=>reject(tx.error||new Error('CORRUPT_JOURNAL_TX_ABORTED'));
      });
    }finally{db.close();}
    const corrupt=await history.checkLastReadyValidity();
    if(corrupt.current!==false||
       corrupt.status!=='READY_EVIDENCE_UNVERIFIABLE'||
       corrupt.history_error!=='QUALIFICATION_HISTORY_INVALID_BROKEN_EVENT_LINK'){
      fail('CORRUPT_JOURNAL_READY_NOT_FAIL_CLOSED:'+String(corrupt&&corrupt.status));
    }
    let rejectedAppend=false,appendError='';
    try{
      await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY.recordQualification(blocked,options);
    }catch(error){
      rejectedAppend=true;
      appendError=String(error&&error.message||error);
    }
    if(!rejectedAppend)fail('CORRUPT_JOURNAL_APPEND_WAS_NOT_REJECTED');
    if(!appendError.includes('QUALIFICATION_HISTORY_APPEND_REJECTED_CORRUPT_JOURNAL:BROKEN_EVENT_LINK'))
      fail('CORRUPT_JOURNAL_REJECTION_REASON_LOST:'+appendError);
    const after=await history.listEvents();
    if(after.length!==5||after[4].previous_event_id!=='disconnected_parent'){
      fail('CORRUPT_JOURNAL_WAS_OVERWRITTEN_OR_APPENDED');
    }
    const afterVerdict=await history.checkLastReadyValidity();
    if(afterVerdict.status!=='READY_EVIDENCE_UNVERIFIABLE'||afterVerdict.current!==false){
      fail('CORRUPT_JOURNAL_CHANGED_VERDICT_AFTER_FAILED_APPEND');
    }
    // Metadata-level corruption was previously hidden by readRow(): a
    // present row with a non-array events field looked like new empty history.
    // Exercise malformed version and events separately in real IndexedDB.
    async function overwriteJournalRow(mutator){
      const current=await store.get(store.STORES.metadata,'qualification_history_v1');
      mutator(current);
      const db=await store.openDb();
      try{
        const tx=db.transaction(store.STORES.metadata,'readwrite');
        tx.objectStore(store.STORES.metadata).put(current);
        await new Promise((resolve,reject)=>{
          tx.oncomplete=resolve;
          tx.onerror=()=>reject(tx.error||new Error('ROW_CORRUPTION_WRITE_FAILED'));
          tx.onabort=()=>reject(tx.error||new Error('ROW_CORRUPTION_WRITE_ABORTED'));
        });
      } finally { db.close(); }
    }
    for(const [change,expected] of [
      [r=>{r.version=999},'QUALIFICATION_HISTORY_INVALID_ROW_VERSION_MISMATCH'],
      [r=>{r.version=1;r.events='damaged-events-field'},'QUALIFICATION_HISTORY_INVALID_ROW_EVENTS_NOT_ARRAY']
    ]){
      await overwriteJournalRow(change);
      const verdict=await history.checkLastReadyValidity();
      if(verdict.status!=='READY_EVIDENCE_UNVERIFIABLE'||verdict.current!==false||
         verdict.history_error!==expected){
        fail('CORRUPT_METADATA_MISCLASSIFIED:'+String(verdict&&verdict.history_error));
      }
      let rejected=false,rejectionMessage='';
      try{
        await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY.recordQualification(blocked,options);
      }catch(error){
        rejected=true;
        rejectionMessage=String(error&&error.message||error);
      }
      if(!rejected)fail('CORRUPT_METADATA_APPEND_ACCEPTED:'+expected);
      const exactReason=expected.replace('QUALIFICATION_HISTORY_INVALID_','QUALIFICATION_HISTORY_APPEND_REJECTED_');
      if(!rejectionMessage.includes(exactReason))
        fail('CORRUPT_METADATA_REJECTION_REASON_LOST:'+rejectionMessage);
      const stored=await store.get(store.STORES.metadata,'qualification_history_v1');
      if(expected.endsWith('VERSION_MISMATCH')&&stored.events.length!==5)
        fail('CORRUPT_VERSION_APPENDED_HISTORY');
      if(expected.endsWith('EVENTS_NOT_ARRAY')&&stored.events!=='damaged-events-field')
        fail('CORRUPT_EVENTS_WERE_RESET');
    }
  out.dataset.state='pass';
    out.textContent=[
      'QUALIFICATION_INDEXEDDB_BROWSER=PASS',
      'QUALIFICATION_CROSS_IFRAME_CONCURRENT_APPEND=PASS',
      'QUALIFICATION_EVENT_CHAIN_DURABLE=PASS',
      'QUALIFICATION_BLOCKED_REVOKES_READY=PASS',
      'QUALIFICATION_BROWSER_REQUALIFIED_CURRENT=PASS',
      'QUALIFICATION_CONTRADICTORY_READY_REFUSED=PASS',
      'QUALIFICATION_BROWSER_PRODUCTION_DISABLED=PASS',
      'QUALIFICATION_CORRUPTED_HISTORY_FAIL_CLOSED=PASS',
      'QUALIFICATION_CORRUPTED_HISTORY_APPEND_REFUSED=PASS',
      'QUALIFICATION_CORRUPT_METADATA_UNVERIFIABLE=PASS',
      'QUALIFICATION_CORRUPT_METADATA_APPEND_REFUSED=PASS',
      'QUALIFICATION_APPEND_DIAGNOSTIC_PRESERVED=PASS',
      'SHADOW_EVENT_CROSS_TAB_ATOMIC_DEDUPE=PASS',
      'SHADOW_EVENT_DUPLICATE_ID_REJECTED=PASS',
      'QUALIFICATION_INDEXEDDB_EVENT_COUNT=5'
    ].join('\n');
  }catch(error){
  out.dataset.state='fail';
    out.textContent='QUALIFICATION_INDEXEDDB_BROWSER=FAIL '+String(error&&error.stack||error);
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settlement qualification multi-tab IndexedDB smoke</title></head>
<body>
<pre id="result">QUALIFICATION_INDEXEDDB_BROWSER=PENDING</pre>
<script src="./settlement-store.js"></script>
<script src="./settlement-build-identity.js"></script>
<script>
(function(global){
  const hash='a'.repeat(64);
  const identity={
    api_version:'offline-synthetic-test',identity_contract:'kts-parser-identity-v1',
    identities:{
      mb:{parser_version:'synthetic',identity_sha256:hash},
      mn_mt:{parser_version:'synthetic',identity_sha256:hash}
    }
  };
  global.KTS_SETTLEMENT_QUALIFICATION={
    version:'synthetic-qualification-dependency',messageInWindow:()=>false
  };
  global.KTS_SETTLEMENT_REGRESSION_CASES={
    version:'synthetic-regression-dependency',listPinnedCases:async()=>[]
  };
  global.KTS_SETTLEMENT_REGRESSION_CANDIDATES={listCandidates:async()=>[]};
  global.KTS_SETTLEMENT_SHADOW_RUNTIME={version:'synthetic-no-oracle'};
  global.KTS_SETTLEMENT_PARSER_PROVIDER={
    version:'synthetic-parser-provider',fetchIdentity:async()=>identity
  };
  global.KTS_QUALIFICATION_BROWSER_TEST_IDENTITY=identity;
})(window);
</script>
<script src="./settlement-qualification-history.js"></script>
<script src="./settlement-regression-cases.js"></script>
<script src="./settlement-regression-candidates.js"></script>
<script>
(async()=>{
  const query=new URLSearchParams(location.search);
  if(query.has('worker'))return;
  const out=document.getElementById('result');
  const fail=message=>{throw new Error(message);};
  const store=window.KTS_SETTLEMENT_STORE;
  const history=window.KTS_SETTLEMENT_QUALIFICATION_HISTORY;
  const workerFrames=[];
  try{
    if(!window.isSecureContext)fail('BROWSER_NOT_SECURE_CONTEXT');
    if(!store||!history||!window.crypto||!crypto.subtle)fail('BROWSER_APIS_MISSING');
    // A fresh, disposable Chromium profile is required by the CI workflow.
    const meta=await store.get(store.STORES.metadata,'qualification_history_v1');
    if(meta&&Array.isArray(meta.events)&&meta.events.length)fail('PROFILE_NOT_ISOLATED');
    for(let i=0;i<2;i++){
      const frame=document.createElement('iframe');
      frame.style.display='none';
      const loaded=new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('WORKER_IFRAME_TIMEOUT_'+i)),12000);
        frame.addEventListener('load',()=>{clearTimeout(timer);resolve();},{once:true});
      });
      frame.src='./qualification-indexeddb-smoke.html?worker=1&slot='+i;
      document.body.appendChild(frame);
      workerFrames.push({frame,loaded});
    }
    await Promise.all(workerFrames.map(x=>x.loaded));
    const workers=workerFrames.map(x=>x.frame.contentWindow);
    if(workers.some(w=>!w||!w.KTS_SETTLEMENT_QUALIFICATION_HISTORY)){
      fail('WORKER_HISTORY_API_MISSING');
    }
    // Two real browsing contexts must serialize shadow receipt dedupe.
    const shadowInput={
      scope_id:'scope:shadow-atomic-test:2026-09-22:mn',
      partner_id:'shadow-atomic-test',business_date:'2026-09-22',region:'mn',
      trigger:'SYNTHETIC_CONCURRENT_AUDIT',
      local_snapshot:{total_xac:0},reference_snapshot:{total_xac:0},
      comparison:{status:'MATCH_EXACT'},comparison_status:'MATCH_EXACT'
    };
    const shadowOutcomes=await Promise.all(workers.map(w=>
      w.KTS_SETTLEMENT_STORE.saveShadowEvent(shadowInput)));
    if(shadowOutcomes.filter(r=>r.changed===true).length!==1||
       shadowOutcomes.filter(r=>r.changed===false).length!==1||
       shadowOutcomes[0].event.id!==shadowOutcomes[1].event.id)
      fail('CROSS_TAB_SHADOW_DEDUPE_FAILED');
    let shadowPersisted=await store.listShadowEvents({scope_id:shadowInput.scope_id});
    if(shadowPersisted.length!==1||
       shadowPersisted[0].id!==shadowOutcomes[0].event.id)
      fail('CROSS_TAB_SHADOW_RECEIPT_NOT_DURABLE');
    const shadowDifferent={...shadowInput,comparison:{status:'NOT_COMPARABLE'},
      comparison_status:'NOT_COMPARABLE'};
    const appended=await workers[1].KTS_SETTLEMENT_STORE.saveShadowEvent(shadowDifferent);
    if(appended.changed!==true||appended.previous.id!==shadowOutcomes[0].event.id)
      fail('SHADOW_DIFFERENT_EVIDENCE_NOT_APPENDED');
    let duplicateIdRejected=false;
    try {
      await workers[0].KTS_SETTLEMENT_STORE.saveShadowEvent({
        ...shadowInput,id:shadowOutcomes[0].event.id,comparison:{status:'MISMATCH'},
        comparison_status:'MISMATCH'
      });
    } catch (_) {duplicateIdRejected=true;}
    shadowPersisted=await store.listShadowEvents({scope_id:shadowInput.scope_id});
    if(!duplicateIdRejected||shadowPersisted.length!==2||
       shadowPersisted[0].id!==shadowOutcomes[0].event.id||
       shadowPersisted[1].id!==appended.event.id)
      fail('SHADOW_RECEIPT_ID_OVERWRITE_NOT_REJECTED');
    const options={from_date:'2026-09-22',to_date:'2026-09-22',required_observation_days:1};
    const blocked={qualification_state:'BLOCKED_SHADOW_QUALIFICATION',
      ready_for_production_review:false,blockers:['ACCEPTANCE_SYNTHETIC_BLOCKED'],
      production_enabled:false,merge_authorized:false};
    // Two real browsing contexts use separate IndexedDB connections.
    const first=await Promise.all(workers.map(w=>w.KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(blocked,options)));
    if(first.length!==2||first[0].id===first[1].id)fail('CONCURRENT_EVENT_IDS_COLLIDED');
    const persisted=await history.listEvents();
    if(persisted.length!==2)fail('CONCURRENT_INDEXEDDB_LOST_EVENT:'+persisted.length);
    if(persisted[1].previous_event_id!==persisted[0].id){
      fail('CONCURRENT_INDEXEDDB_EVENT_CHAIN_BROKEN');
    }
    if(!first.every(e=>persisted.some(p=>p.id===e.id))){
      fail('CONCURRENT_INDEXEDDB_EVENT_NOT_DURABLE');
    }
    const identity=window.KTS_QUALIFICATION_BROWSER_TEST_IDENTITY;
    const ready={
      qualification_state:'READY_FOR_PRODUCTION_REVIEW',
      ready_for_production_review:true,production_enabled:false,merge_authorized:false,
      parser_backend:{met:true,live_identity:identity},blockers:[]
    };
    for(const [invalid,reason] of [
      [{...ready,qualification_state:'BLOCKED_SHADOW_QUALIFICATION'},'READY_STATE_CONTRADICTION'],
      [{...ready,blockers:['UNEXPLAINED_MONETARY_MISMATCH']},'READY_HAS_BLOCKERS'],
      [{...ready,merge_authorized:true},'SNAPSHOT_AUTHORITY_ESCALATION'],
      [{...ready,regression_gate:{met:false}},'READY_GATE_NOT_MET_REGRESSION_GATE'],
      [{...ready,kqxs_verification:{met:false}},'READY_GATE_NOT_MET_KQXS_VERIFICATION'],
      [{...ready,ready_for_production_review:false},'BLOCKED_STATE_CONTRADICTION']
    ]){
      let rejected=false;
      try{
        await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY.recordQualification(invalid,options);
      } catch(error) {
        rejected=String(error&&error.message||error).includes('QUALIFICATION_DECISION_INVALID_'+reason);
      }
      if(!rejected)fail('CONTRADICTORY_READY_NOT_REFUSED:'+reason);
      const untouched=await history.listEvents();
      if(untouched.length!==2)fail('CONTRADICTORY_READY_APPENDED:'+reason);
    }
    const readySaved=await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(ready,options);
    const current=await history.checkLastReadyValidity();
    if(current.status!=='READY_EVIDENCE_CURRENT'||current.current!==true){
      fail('READY_CURRENT_AFTER_QUALIFICATION:'+current.status);
    }
    const blockedSaved=await workers[1].KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(blocked,options);
    const revoked=await history.checkLastReadyValidity();
    if(revoked.status!=='READY_EVIDENCE_STALE'||revoked.current!==false||
       revoked.invalidated_by_event_id!==blockedSaved.id){
      fail('BLOCKED_DID_NOT_REVOKE_READY:'+revoked.status);
    }
    const requalified=await workers[1].KTS_SETTLEMENT_QUALIFICATION_HISTORY
      .recordQualification(ready,options);
    const refreshed=await history.checkLastReadyValidity();
    if(refreshed.status!=='READY_EVIDENCE_CURRENT'||refreshed.current!==true||
       refreshed.ready_event.id!==requalified.id){
      fail('REQUALIFIED_READY_NOT_CURRENT:'+refreshed.status);
    }
    const events=await history.listEvents();
    if(events.length!==5||events[2].id!==readySaved.id||events[4].id!==requalified.id){
      fail('INDEXEDDB_APPEND_SEQUENCE_UNEXPECTED:'+events.length);
    }
    if(events.some(e=>e.production_enabled!==false||e.merge_authorized!==false)){
      fail('QUALIFICATION_AUTHORITY_ESCALATION');
    }
    // Synthetic damaged history in the disposable browser profile: the
    // most recent READY must never be considered current after chain tamper.
    const row=await store.get(store.STORES.metadata,'qualification_history_v1');
    if(!row||!Array.isArray(row.events)||row.events.length!==5){
      fail('CORRUPT_JOURNAL_FIXTURE_MISSING');
    }
    row.events[4].previous_event_id='disconnected_parent';
    const db=await store.openDb();
    try {
      const tx=db.transaction(store.STORES.metadata,'readwrite');
      tx.objectStore(store.STORES.metadata).put(row);
      await new Promise((resolve,reject)=>{
        tx.oncomplete=resolve;
        tx.onerror=()=>reject(tx.error||new Error('CORRUPT_JOURNAL_TX_FAILED'));
        tx.onabort=()=>reject(tx.error||new Error('CORRUPT_JOURNAL_TX_ABORTED'));
      });
    }finally{db.close();}
    const corrupt=await history.checkLastReadyValidity();
    if(corrupt.current!==false||
       corrupt.status!=='READY_EVIDENCE_UNVERIFIABLE'||
       corrupt.history_error!=='QUALIFICATION_HISTORY_INVALID_BROKEN_EVENT_LINK'){
      fail('CORRUPT_JOURNAL_READY_NOT_FAIL_CLOSED:'+String(corrupt&&corrupt.status));
    }
    let rejectedAppend=false,appendError='';
    try{
      await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY.recordQualification(blocked,options);
    }catch(error){
      rejectedAppend=true;
      appendError=String(error&&error.message||error);
    }
    if(!rejectedAppend)fail('CORRUPT_JOURNAL_APPEND_WAS_NOT_REJECTED');
    if(!appendError.includes('QUALIFICATION_HISTORY_APPEND_REJECTED_CORRUPT_JOURNAL:BROKEN_EVENT_LINK'))
      fail('CORRUPT_JOURNAL_REJECTION_REASON_LOST:'+appendError);
    const after=await history.listEvents();
    if(after.length!==5||after[4].previous_event_id!=='disconnected_parent'){
      fail('CORRUPT_JOURNAL_WAS_OVERWRITTEN_OR_APPENDED');
    }
    const afterVerdict=await history.checkLastReadyValidity();
    if(afterVerdict.status!=='READY_EVIDENCE_UNVERIFIABLE'||afterVerdict.current!==false){
      fail('CORRUPT_JOURNAL_CHANGED_VERDICT_AFTER_FAILED_APPEND');
    }
    // Metadata-level corruption was previously hidden by readRow(): a
    // present row with a non-array events field looked like new empty history.
    // Exercise malformed version and events separately in real IndexedDB.
    async function overwriteJournalRow(mutator){
      const current=await store.get(store.STORES.metadata,'qualification_history_v1');
      mutator(current);
      const db=await store.openDb();
      try{
        const tx=db.transaction(store.STORES.metadata,'readwrite');
        tx.objectStore(store.STORES.metadata).put(current);
        await new Promise((resolve,reject)=>{
          tx.oncomplete=resolve;
          tx.onerror=()=>reject(tx.error||new Error('ROW_CORRUPTION_WRITE_FAILED'));
          tx.onabort=()=>reject(tx.error||new Error('ROW_CORRUPTION_WRITE_ABORTED'));
        });
      } finally { db.close(); }
    }
    for(const [change,expected] of [
      [r=>{r.version=999},'QUALIFICATION_HISTORY_INVALID_ROW_VERSION_MISMATCH'],
      [r=>{r.version=1;r.events='damaged-events-field'},'QUALIFICATION_HISTORY_INVALID_ROW_EVENTS_NOT_ARRAY']
    ]){
      await overwriteJournalRow(change);
      const verdict=await history.checkLastReadyValidity();
      if(verdict.status!=='READY_EVIDENCE_UNVERIFIABLE'||verdict.current!==false||
         verdict.history_error!==expected){
        fail('CORRUPT_METADATA_MISCLASSIFIED:'+String(verdict&&verdict.history_error));
      }
      let rejected=false,rejectionMessage='';
      try{
        await workers[0].KTS_SETTLEMENT_QUALIFICATION_HISTORY.recordQualification(blocked,options);
      }catch(error){
        rejected=true;
        rejectionMessage=String(error&&error.message||error);
      }
      if(!rejected)fail('CORRUPT_METADATA_APPEND_ACCEPTED:'+expected);
      const exactReason=expected.replace('QUALIFICATION_HISTORY_INVALID_','QUALIFICATION_HISTORY_APPEND_REJECTED_');
      if(!rejectionMessage.includes(exactReason))
        fail('CORRUPT_METADATA_REJECTION_REASON_LOST:'+rejectionMessage);
      const stored=await store.get(store.STORES.metadata,'qualification_history_v1');
      if(expected.endsWith('VERSION_MISMATCH')&&stored.events.length!==5)
        fail('CORRUPT_VERSION_APPENDED_HISTORY');
      if(expected.endsWith('EVENTS_NOT_ARRAY')&&stored.events!=='damaged-events-field')
        fail('CORRUPT_EVENTS_WERE_RESET');
    }
    // Disposable, synthetic cross-tab monetary commit fixture. This is NOT
    // historical money qualification and never touches customer data.
    const scopePartner='synthetic-scope-atomic',scopeDate='2026-09-22';
    const scopeID='scope:'+scopePartner+':'+scopeDate+':mn';
    const partner={id:scopePartner,name:'Synthetic Atomic',role:'customer',active:true};
    const config={id:scopePartner+':v1',partner_id:scopePartner,version:1,
      effective_from_date:'2026-09-01',region_pricing:{mn:{B:{win:80}}},
      region_terms:{mn:{total_percent:'100'}}};
    const message={id:'synthetic-atomic-message',partner_id:scopePartner,
      business_date:scopeDate,region:'mn',created_at:'2026-09-22T00:00:00Z',
      updated_at:'2026-09-22T00:00:00Z',status:'parsed_waiting_result',
      raw_text:'11 b 1n',canonical_payload:{region:'mn',legs:[{code:'B'}]},
      config_snapshot:config};
    const draw={id:scopeDate+':mn',business_date:scopeDate,region:'mn',
      complete:true,verified:true,verification_status:'verified',
      stations:[{code:'tp',prizes:{DB:['123456']}}]};
    async function putSynthetic(table,value) {
      const db=await store.openDb();
      try {
        const tx=db.transaction(table,'readwrite');
        tx.objectStore(table).put(value);
        await new Promise((resolve,reject)=>{
          tx.oncomplete=resolve;
          tx.onerror=()=>reject(tx.error||new Error('ATOMIC_FIXTURE_WRITE_FAILED'));
          tx.onabort=()=>reject(tx.error||new Error('ATOMIC_FIXTURE_WRITE_ABORTED'));
        });
      }finally{db.close();}
    }
    await putSynthetic(store.STORES.partners,partner);
    await putSynthetic(store.STORES.configs,config);
    await putSynthetic(store.STORES.messages,message);
    await putSynthetic(store.STORES.results,draw);
    const settle={id:scopeID,partner_id:scopePartner,business_date:scopeDate,
      region:'mn',engine_version:'synthetic-no-financial-oracle',
      config_snapshot:config,lottery_result_snapshot:draw,
      settlement_result:{total_xac:0,total_qua_co:0,total_payout:0,final_net:0},
      scope_status:'complete_unverified',comparison_status:'unverified'};
    const initialEvidence={messages:[message],config,result:draw,partner,settlement:null};
    const racing=await Promise.all(workers.map(w=>
      w.KTS_SETTLEMENT_STORE.saveSettlementIfScopeUnchanged(settle,initialEvidence)));
    if(racing.filter(x=>!x.superseded&&x.saved).length!==1||
       racing.filter(x=>x.superseded).length!==1)
      fail('SETTLEMENT_CROSS_TAB_ATOMIC_CAS_FAILED');
    const currentSettlement=await store.get(store.STORES.settlements,scopeID);
    const currentMessage=await store.get(store.STORES.messages,message.id);
    if(!currentSettlement||currentMessage.status!=='settled_unverified')
      fail('SETTLEMENT_MESSAGE_STATUS_NOT_ATOMICALLY_COMMITTED');
    const currentEvidence={messages:[currentMessage],config,result:draw,partner,
      settlement:currentSettlement};
    for(const [table,alter,original] of [
      [store.STORES.messages,m=>{m.canonical_payload.legs[0].code='DD'},currentMessage],
      [store.STORES.configs,c=>{c.region_pricing.mn.B.win=1234},config],
      [store.STORES.results,r=>{r.stations[0].prizes.DB[0]='654321'},draw],
      [store.STORES.partners,p=>{p.role='owner'},partner]
    ]){
      const edited=JSON.parse(JSON.stringify(original));
      alter(edited);
      await putSynthetic(table,edited);
      const stale=await workers[0].KTS_SETTLEMENT_STORE
        .saveSettlementIfScopeUnchanged(settle,currentEvidence);
      if(!stale.superseded||stale.saved)
        fail('SETTLEMENT_CHANGED_INPUT_COMMITTED:'+table);
      await putSynthetic(table,original);
    }
    const afterMoney=await store.get(store.STORES.settlements,scopeID);
    if(afterMoney.id!==currentSettlement.id||afterMoney.updated_at!==currentSettlement.updated_at)
      fail('SETTLEMENT_STALE_INPUT_CHANGED_MONEY');
    // An invalid second message must not partially change the first
    // message's settled status or write the monetary row.
    const foreign={...message,id:'synthetic-foreign-config-message',
      config_snapshot:{...config,partner_id:'another-partner'},
      status:'parsed_waiting_result'};
    await putSynthetic(store.STORES.messages,foreign);
    const beforeFirst=await store.get(store.STORES.messages,message.id);
    const guarded=await workers[0].KTS_SETTLEMENT_STORE
      .saveSettlementIfScopeUnchanged(settle,{
        messages:[beforeFirst,foreign],config,result:draw,partner,
        settlement:currentSettlement
      });
    if(!guarded.superseded||guarded.saved)
      fail('FOREIGN_CONFIG_MESSAGE_WAS_COMMITTED');
    const untouchedFirst=await store.get(store.STORES.messages,message.id);
    const untouchedMoney=await store.get(store.STORES.settlements,scopeID);
    if(JSON.stringify(untouchedFirst)!==JSON.stringify(beforeFirst)||
       JSON.stringify(untouchedMoney)!==JSON.stringify(currentSettlement))
      fail('INVALID_LATE_MESSAGE_CAUSED_PARTIAL_WRITE');

    // A delayed BLOCKED or EMPTY record is also conditional on the same
    // atomic input and previous-settlement snapshot, without touching money.
    const beforeBlock=await store.get(store.STORES.messages,message.id);
    const blockedScope={...settle,scope_status:'blocked',
      comparison_status:'blocked',blocked_reasons:['SYNTHETIC_UNSUPPORTED']};
    const blockedCommit=await workers[0].KTS_SETTLEMENT_STORE
      .saveSettlementIfScopeUnchanged(blockedScope,{
        messages:[beforeBlock,foreign],config,result:draw,partner,
        settlement:currentSettlement
      });
    if(blockedCommit.superseded||!blockedCommit.saved||
       (await store.get(store.STORES.messages,message.id)).status!==beforeBlock.status)
      fail('BLOCKED_ATOMIC_COMMIT_FAILED');
    const staleReady=await workers[1].KTS_SETTLEMENT_STORE
      .saveSettlementIfScopeUnchanged(settle,{
        messages:[beforeBlock,foreign],config,result:draw,partner,
        settlement:currentSettlement
      });
    if(!staleReady.superseded||staleReady.saved)
      fail('STALE_READY_OVERWROTE_BLOCKED');

    const emptyPartner='synthetic-empty-atomic';
    const emptyID='scope:'+emptyPartner+':'+scopeDate+':mn';
    const emptyScope={...settle,id:emptyID,partner_id:emptyPartner,
      config_snapshot:null,lottery_result_snapshot:null,scope_status:'empty',
      comparison_status:'empty',message_ids:[]};
    const emptyInputs={messages:[],config:null,result:draw,partner:null,settlement:null};
    const emptyCommit=await workers[0].KTS_SETTLEMENT_STORE
      .saveSettlementIfScopeUnchanged(emptyScope,emptyInputs);
    if(emptyCommit.superseded||!emptyCommit.saved)
      fail('EMPTY_ATOMIC_COMMIT_FAILED');
    await putSynthetic(store.STORES.messages,{
      ...message,id:'synthetic-new-bet-after-empty',partner_id:emptyPartner,
      config_snapshot:null
    });
    const staleEmpty=await workers[1].KTS_SETTLEMENT_STORE
      .saveSettlementIfScopeUnchanged(emptyScope,{
        ...emptyInputs,settlement:emptyCommit.saved
      });
    if(!staleEmpty.superseded||staleEmpty.saved)
      fail('STALE_EMPTY_OVERWROTE_NEW_BET');
    // Real browser contexts pin golden regressions using the actual
    // regression module with ONLY synthetic zero-money fixtures.
    const regressionCase=i=>({
      id:'synthetic-golden-'+i,
      scope:{partner_id:'synthetic-golden-partner',business_date:'2026-09-22',region:'mn'},
      partner_role:'customer',
      config_snapshot:{partner_id:'synthetic-golden-partner',version:1},
      lottery_result_snapshot:{region:'mn',business_date:'2026-09-22'},
      messages:[{id:'synthetic-golden-message-'+i,region:'mn',raw_text:'11 b 1n',
        canonical_payload:{region:'mn',legs:[{code:'2CB'}]}}],
      expected_reference:{totals:{xac:'0',qua_co:'0',payout:'0',final:'0'}}
    });
    if(workers.some(w=>!w.KTS_SETTLEMENT_REGRESSION_CASES||
       typeof w.KTS_SETTLEMENT_REGRESSION_CASES.pinCase!=='function'))
      fail('GOLDEN_REGRESSION_WORKER_API_MISSING');
    await Promise.all(workers.map((w,i)=>
      w.KTS_SETTLEMENT_REGRESSION_CASES.pinCase(regressionCase(i))));
    const golden=await window.KTS_SETTLEMENT_REGRESSION_CASES.listPinnedCases();
    if(golden.length!==2||!golden.some(c=>c.id==='synthetic-golden-0')||
       !golden.some(c=>c.id==='synthetic-golden-1'))
      fail('GOLDEN_CONCURRENT_PIN_LOST_CASE');
    await Promise.all([
      workers[0].KTS_SETTLEMENT_REGRESSION_CASES.removePinnedCase('synthetic-golden-0'),
      workers[1].KTS_SETTLEMENT_REGRESSION_CASES.pinCase(regressionCase(2))
    ]);
    const retained=await window.KTS_SETTLEMENT_REGRESSION_CASES.listPinnedCases();
    if(retained.length!==2||retained.some(c=>c.id==='synthetic-golden-0')||
       !retained.some(c=>c.id==='synthetic-golden-1')||
       !retained.some(c=>c.id==='synthetic-golden-2'))
      fail('GOLDEN_CONCURRENT_REMOVE_AND_PIN_LOST_UPDATE');
    const corruptGolden={
      key:'shadow_regression_cases_v1',version:1,cases:'CORRUPTED'
    };
    await putSynthetic(store.STORES.metadata,corruptGolden);
    let refusedCorrupt=false;
    try {await workers[0].KTS_SETTLEMENT_REGRESSION_CASES.pinCase(regressionCase(3));}
    catch(e){refusedCorrupt=String(e&&e.message||e).includes('REGRESSION_METADATA_CORRUPTED');}
    const preservedCorrupt=await store.get(store.STORES.metadata,corruptGolden.key);
    if(!refusedCorrupt||preservedCorrupt.cases!=='CORRUPTED')
      fail('CORRUPT_GOLDEN_METADATA_OVERWRITTEN');

    // Restoring *only synthetic fixture rows*: never imports or overwrites
    // any genuine historical payout or unverified HIOSKT source.
    await putSynthetic(store.STORES.metadata,{
      key:corruptGolden.key,version:1,cases:retained
    });
    const candApi=window.KTS_SETTLEMENT_REGRESSION_CANDIDATES;
    if(!candApi||typeof candApi.confirmAndPin!=='function'||
       workers.some(w=>!w.KTS_SETTLEMENT_REGRESSION_CANDIDATES))
      fail('CANDIDATE_BROWSER_WORKER_API_MISSING');
    const candidateFor=i=>candApi.normalizeCandidate({

    const protectedRows=(await store.getAll(store.STORES.metadata))
      .filter(row=>protectedKeys.has(row.key));
    const initialShadowReceipt=await store.get(
      store.STORES.shadowEvents,shadowOutcomes[0].event.id);
    const destructive={format:'kts-settlement-export',version:5,stores:{
      [store.STORES.metadata]:protectedRows,
      [store.STORES.shadowEvents]:[]
    }};
    let shadowReplaceBlocked=false,shadowReplaceReason='NO_ERROR';
    try{await workers[0].KTS_SETTLEMENT_STORE.importAll(destructive,{replace:true});}
    catch(error){
      shadowReplaceReason=String(error&&error.message||error);
      shadowReplaceBlocked=shadowReplaceReason
        .includes('IMPORT_REPLACE_SHADOW_EVIDENCE_DENIED');
    }
    if(!initialShadowReceipt||!shadowReplaceBlocked||
       JSON.stringify(await store.get(
         store.STORES.shadowEvents,initialShadowReceipt&&initialShadowReceipt.id))!==
       JSON.stringify(initialShadowReceipt))
      fail('REPLACE_SHADOW_SOURCE_RECEIPT_ERASED_OR_NOT_GUARDED:'+
       shadowReplaceReason+':receipt_present='+Boolean(initialShadowReceipt));
    if(originalJournal)await putSynthetic(store.STORES.metadata,originalJournal);
    else await store.remove(store.STORES.metadata,'qualification_history_v1');
    // Imported backup IDs are not allowed to hide a conflicting KQXS
    // drawing or a different settlement amount. Nothing must be overwritten.
    const knownDraw=await store.get(store.STORES.results,draw.id);
    const changedDraw={...knownDraw,
      stations:[{code:'tp',prizes:{DB:['999999']}}]};
    delete changedDraw.fingerprint;
    const conflictingDrawBackup={format:'kts-settlement-export',version:5,
      stores:{[store.STORES.results]:[changedDraw]}};
    let drawRejected=false;
    try{await workers[0].KTS_SETTLEMENT_STORE.importAll(
      conflictingDrawBackup,{replace:false});}
    catch(error){drawRejected=String(error&&error.message||error)
      .includes('IMPORT_RESULT_CONTENT_COLLISION');}
    if(!drawRejected||JSON.stringify(await store.get(
        store.STORES.results,knownDraw.id))!==JSON.stringify(knownDraw))
      fail('CONFLICTING_KQXS_IMPORT_SILENTLY_SKIPPED');
    const knownSettlement=await store.get(store.STORES.settlements,scopeID);
    const conflictingSettlement={...knownSettlement,
      settlement_result:{...(knownSettlement.settlement_result||{}),final_net:500}};
    const conflictingMoneyBackup={format:'kts-settlement-export',version:5,
      stores:{[store.STORES.settlements]:[conflictingSettlement]}};
    let moneyRejected=false;
    try{await workers[1].KTS_SETTLEMENT_STORE.importAll(
      conflictingMoneyBackup,{replace:false});}
    catch(error){moneyRejected=String(error&&error.message||error)
      .includes('IMPORT_SETTLEMENT_MONETARY_COLLISION');}
    if(!moneyRejected||JSON.stringify(await store.get(
        store.STORES.settlements,scopeID))!==JSON.stringify(knownSettlement))
      fail('CONFLICTING_SETTLEMENT_IMPORT_SILENTLY_SKIPPED');
    // Positive: an identical pre-existing draw + monetary scope may merge
    // without replacing either row; both CAS reads occur in the real IDB tx.
    const txPartner={id:'synthetic-cas-import',name:'Synthetic CAS',role:'customer',
      active:true};
    const txScope='scope:'+txPartner.id+':2026-09-22:mn';
    const txMoney={id:txScope,partner_id:txPartner.id,
      business_date:'2026-09-22',region:'mn',scope_status:'empty',
      comparison_status:'empty',message_ids:[],config_snapshot:null,
      settlement_result:{total_xac:0,total_qua_co:0,total_payout:0,
        refund_amount:0,final_net:0}};
    await putSynthetic(store.STORES.partners,txPartner);
    await putSynthetic(store.STORES.settlements,txMoney);
    const goodDraw=await store.get(store.STORES.results,draw.id);
    const positiveMonetary={format:'kts-settlement-export',version:5,
      stores:{[store.STORES.results]:[goodDraw],
        [store.STORES.settlements]:[txMoney]}};
    const accepted=await workers[1].KTS_SETTLEMENT_STORE.importAll(
      positiveMonetary,{replace:false});
    if(!accepted.valid||
       JSON.stringify(await store.get(store.STORES.results,draw.id))!==
         JSON.stringify(goodDraw)||
       JSON.stringify(await store.get(store.STORES.settlements,txScope))!==
         JSON.stringify(txMoney))
      fail('IDENTICAL_KQXS_MONEY_IMPORT_ATOMIC_CAS_NOT_IDEMPOTENT');
    await store.remove(store.STORES.settlements,txScope);
    await store.remove(store.STORES.partners,txPartner.id);
    // KQXS audit events are immutable receipts, separate from the
    // latest results snapshot. An older backup cannot reuse a receipt ID
    // with different observed_at or prizes while silently skipping it.
    const eventRow={id:'result_event_synthetic_import_receipt',
      result_id:draw.id,business_date:'2026-09-22',region:'mn',
      status:'partial',complete:false,stations:[],
      observed_at:'2026-09-22T12:00:00.000Z'};
    await putSynthetic(store.STORES.resultEvents,eventRow);
    const goodEventBackup={format:'kts-settlement-export',version:5,
      stores:{[store.STORES.resultEvents]:[eventRow]}};
    const resultEventAccepted=await workers[0].KTS_SETTLEMENT_STORE.importAll(
      goodEventBackup,{replace:false});
    if(!resultEventAccepted.valid)
      fail('IDENTICAL_KQXS_EVENT_RECEIPT_BACKUP_REJECTED');
    const alteredEvent={...eventRow,observed_at:'2026-09-23T12:00:00.000Z'};
    let eventRejected=false;
    try{
      await workers[1].KTS_SETTLEMENT_STORE.importAll({
        format:'kts-settlement-export',version:5,
        stores:{[store.STORES.resultEvents]:[alteredEvent]}
      },{replace:false});
    }catch(error){eventRejected=String(error&&error.message||error)
      .includes('IMPORT_RESULT_EVENT_CONTENT_COLLISION');}
    if(!eventRejected||JSON.stringify(await store.get(
       store.STORES.resultEvents,eventRow.id))!==JSON.stringify(eventRow))
      fail('KQXS_RESULT_EVENT_AUDIT_RECEIPT_MUTATED');
    await store.remove(store.STORES.resultEvents,eventRow.id);
  out.dataset.state='pass';
    out.textContent=[
      'QUALIFICATION_INDEXEDDB_BROWSER=PASS',
      'QUALIFICATION_CROSS_IFRAME_CONCURRENT_APPEND=PASS',
      'QUALIFICATION_EVENT_CHAIN_DURABLE=PASS',
      'QUALIFICATION_BLOCKED_REVOKES_READY=PASS',
      'QUALIFICATION_BROWSER_REQUALIFIED_CURRENT=PASS',
      'QUALIFICATION_CONTRADICTORY_READY_REFUSED=PASS',
      'QUALIFICATION_BROWSER_PRODUCTION_DISABLED=PASS',
      'QUALIFICATION_CORRUPTED_HISTORY_FAIL_CLOSED=PASS',
      'QUALIFICATION_CORRUPTED_HISTORY_APPEND_REFUSED=PASS',
      'QUALIFICATION_CORRUPT_METADATA_UNVERIFIABLE=PASS',
      'QUALIFICATION_CORRUPT_METADATA_APPEND_REFUSED=PASS',
      'QUALIFICATION_APPEND_DIAGNOSTIC_PRESERVED=PASS',
      'SETTLEMENT_CROSS_TAB_ATOMIC_COMMIT=PASS',
      'SETTLEMENT_INPUT_REVISION_CAS=PASS',
      'SETTLEMENT_MESSAGE_STATUS_TX=PASS',
      'SETTLEMENT_ALL_MESSAGE_CONFIG_PREFLIGHT=PASS',
      'SETTLEMENT_BLOCKED_EMPTY_ATOMIC_CAS=PASS',
       'GOLDEN_CROSS_TAB_METADATA_ATOMIC=PASS',
       'GOLDEN_CORRUPT_METADATA_FAIL_CLOSED=PASS',
       'CANDIDATE_CROSS_TAB_ATOMIC_PROMOTION=PASS',
       'CANDIDATE_PROMOTE_DISMISS_RACE_SERIAL=PASS',
       'CANDIDATE_CORRUPT_METADATA_FAIL_CLOSED=PASS',
       'CANDIDATE_CROSS_TAB_CAPTURE_DEDUPE=PASS',
       'CANDIDATE_DISMISSED_CAPTURE_NO_RESURRECTION=PASS',
       'CANDIDATE_SAME_EVENT_ID_IMMUTABLE=PASS',
       'GOLDEN_SOURCE_ID_IMMUTABLE=PASS',
       'PROMOTED_LINKED_GOLDEN_DELETE_REFUSED=PASS',
       'DUPLICATE_HIOSKT_CANDIDATE_REJECTED=PASS',
       'DUPLICATE_GOLDEN_ID_FAIL_CLOSED=PASS',
       'DUPLICATE_GOLDEN_SOURCE_FAIL_CLOSED=PASS',
       'SECOND_HIOSKT_GOLDEN_CLAIM_REFUSED=PASS',
       'CANDIDATE_SOURCE_ID_FAIL_CLOSED=PASS',
       'CANDIDATE_CASE_SOURCE_FAIL_CLOSED=PASS',
       'CANDIDATE_TERMINAL_RECEIPT_FAIL_CLOSED=PASS',
       'ATOMIC_CROSS_STORE_BACKUP_EXPORT=PASS',
       'HIOSKT_BACKUP_CONFLICT_FAIL_CLOSED=PASS',
       'GOLDEN_ATOMIC_SOURCE_CLAIM_REFUSED=PASS',
       'PROTECTED_EVIDENCE_IMPORT_ATOMIC_CAS_POSITIVE=PASS',
       'REPLACE_PROTECTED_HIOSKT_EVIDENCE_REJECTED=PASS',
       'SHADOW_IMPORT_EVENT_ID_MONETARY_CONFLICT_REJECTED=PASS',
       'SHADOW_IMPORT_SAME_ID_IDENTICAL_MERGE_PASS=YES',
       'REPLACE_SHADOW_SOURCE_RECEIPT_PROTECTED=PASS',
       'IMPORT_KQXS_CONTENT_CONFLICT_REJECTED=PASS',
       'IMPORT_SETTLEMENT_MONEY_CONFLICT_REJECTED=PASS',
       'IDENTICAL_KQXS_SETTLEMENT_IMPORT_ATOMIC_CAS=PASS',
       'IMMUTABLE_KQXS_RESULT_EVENT_RECEIPT=PASS',
       'UNLINKED_GOLDEN_DELETE_ALLOWED=PASS',
      'SHADOW_EVENT_CROSS_TAB_ATOMIC_DEDUPE=PASS',
      'SHADOW_EVENT_DUPLICATE_ID_REJECTED=PASS',
      'QUALIFICATION_INDEXEDDB_EVENT_COUNT=5'
    ].join('\n');
  }catch(error){
  out.dataset.state='fail';
    out.textContent='QUALIFICATION_INDEXEDDB_BROWSER=FAIL '+String(error&&error.stack||error);
  }
})();
